    <script>
      const CAP_KEY = "top50cap";
      const CAPS = [9, 16, 25, 50, 100];
      let MAX = 50;
      try {
        const v = +localStorage.getItem(CAP_KEY);
        if (CAPS.includes(v)) MAX = v;
      } catch (e) {}
      let items = [];
      const $ = (id) => document.getElementById(id);
      $("cap").value = String(MAX);

      // ===== 顶部背景墙：iTunes 拉小图，四排反向无缝滚动 =====
      (function initWall() {
        // 28 张专辑清单（写死）
        const ALBUMS = [
          ["Taylor Swift", "evermore"],
          ["Taylor Swift", "Midnights"],
          ["Taylor Swift", "The Tortured Poets Department Anthology"],
          ["Phoebe Bridgers", "Punisher"],
          ["Phoebe Bridgers", "Stranger in the Alps"],
          ["Phoebe Bridgers", "Lost Weekend"],
          ["Gracie Abrams", "The Secret of Us"],
          ["The 1975", "Being Funny in A Foreign Language"],
          ["Vance Joy", "Dream Your Life Away"],
          ["Harry Styles", "Harry's House"],
          ["Olivia Rodrigo", "SOUR"],
          ["Chilichill", "混入人类计划"],
          ["Calum Scott", "Bridges"],
          ["Haim", "I quit"],
          ["孙燕姿", "逆光"],
          ["Hamilton", "Original Broadway Cast Recording"],
          ["Dear Evan Hansen", "Original Broadway Cast Recording"],
          ["Sam Hunt", "Montevallo"],
          ["Billie Eilish", "HIT ME HARD AND SOFT"],
          ["The Weeknd", "After Hours"],
          ["孙燕姿", "风筝"],
          ["Sam Fender", "Seventeen Going Under"],
          ["beabadoobee", "Beatopia"],
          ["Badly Drawn Boy", "The Hour of Bewilderbeast"],
          ["Ariana Grande", "eternal sunshine"],
          ["Lorde", "Virgin"],
          ["Lorde", "Melodrama"],
          ["Roo Panes", "The Summer Isles"],
        ];

        // 封面取图分辨率：按「实际渲染尺寸 × 设备像素密度」算，保证永远是缩小而不是放大。
        // 桌面 tile 240px @2x = 480 物理像素 → 取 600 留 25% 余量
        // 移动 tile 118px @3x = 354 物理像素 → 同样取 600 也够
        // 600x600 实测单张仅 28KB（iTunes 压缩率很高），28 张合计约 0.8MB
        const DPR = Math.min(window.devicePixelRatio || 1, 3);
        const IS_SMALL = window.matchMedia("(max-width: 640px)").matches;
        const CSS_TILE = IS_SMALL ? 118 : 240; // 与 CSS 里的 .wtile 保持一致
        const NEED_PX = CSS_TILE * DPR;
        // 取不小于需求的最小档位：需求 480 → 600，需求 354 → 400，需求 240 → 300
        const ART_SIZE = NEED_PX > 400 ? 600 : NEED_PX > 240 ? 400 : 300;

        // 缓存键带上分辨率：换尺寸必须换 key，否则会一直读到旧的低清缓存
        const CACHE_KEY = "wallArt_" + ART_SIZE;
        const CACHE_TTL = 1000 * 60 * 60 * 24 * 7; // 一周

        // 每张专辑的 iTunes collectionId（已逐一核对，与上面清单严格一一对应）
        // 用 lookup 直接取图：一次请求可拿多张、无需搜索匹配，快且稳。
        const IDS = [1544268281,1645937456,1742057774,1504699857,1256607808,6781051268,1773473685,1850018862,898051683,1615584999,1560735414,1765302287,1619567066,1809849957,905226289,1129446206,1440675841,1440858319,1739659134,1499378108,1183070065,1578777962,1608069810,1540689690,1800579610,1810905299,1429662346,1651371831];

        // 按行分 4 组（轮转分配，保证每排风格混合）
        const groups = [[], [], [], []];
        ALBUMS.forEach((a, i) => groups[i % 4].push(a));

        // 把任意尺寸后缀归一为目标尺寸，统一用 .jpg（比 png 小很多，视觉无差别）
        const smallArt = (u) =>
          String(u)
            .replace(/\/\d+x\d+bb\.(jpg|jpeg|png|webp)$/i, "/" + ART_SIZE + "x" + ART_SIZE + "bb.jpg")
            .replace(/\/\d+x\d+bb\./i, "/" + ART_SIZE + "x" + ART_SIZE + "bb.");

        function paint(rows) {
          rows.forEach((list, r) => {
            const track = $("wt" + r);
            if (!track || !list.length) return;
            track.innerHTML = "";
            // 复制两遍：配合 translateX(-50%) 实现无缝循环
            for (let copy = 0; copy < 2; copy++) {
              list.forEach((item) => {
                const d = document.createElement("div");
                d.className = "wtile";
                if (item && item.url) {
                  const im = document.createElement("img");
                  im.alt = "";
                  im.decoding = "async";
                  im.onload = () => im.classList.add("on");
                  im.onerror = () => im.remove();
                  im.src = item.url;
                  d.appendChild(im);
                }
                track.appendChild(d);
              });
            }
            // 错开每排节奏，避免四排同步起步
            track.style.animationDelay = -(r * 7) + "s";
          });
        }

        // 先用清单里的信息铺骨架（撑起高度，避免首屏空白）
        const skeleton = groups.map((g) => g.map(([artist, album]) => ({ artist, album, url: "" })));

        function buildFromIds(map) {
          return groups.map((g) =>
            g.map(([artist, album]) => ({ artist, album, url: map[String(artist + "|" + album)] || "" }))
          );
        }

        function readCache() {
          try {
            const raw = localStorage.getItem(CACHE_KEY);
            if (!raw) return null;
            const o = JSON.parse(raw);
            if (!o || !o.map || Date.now() - (o.t || 0) > CACHE_TTL) return null;
            // 关键：至少拿到一半封面才算有效缓存，绝不能把空结果缓存下来
            const vals = Object.values(o.map).filter(Boolean);
            if (vals.length < ALBUMS.length / 2) return null;
            return o.map;
          } catch (e) {
            return null;
          }
        }
        function writeCache(map) {
          try {
            // 只在拿到足够多封面时才写缓存，避免一次网络抖动导致背景墙永久空白
            const vals = Object.values(map).filter(Boolean);
            if (vals.length < ALBUMS.length / 2) return;
            localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), map }));
          } catch (e) {}
        }

        // 用 collectionId 批量 lookup 取封面。
        // file:// 页面的 origin 是 null，iTunes 不返回 CORS 头，所以 fetch 会被拦截 ——
        // 必须走 JSONP（与主搜索的回退方式一致）。
        function jsonpBatch(ids) {
          return new Promise((resolve) => {
            const cb = "wallCb" + Date.now() + Math.floor(Math.random() * 1e6);
            const sc = document.createElement("script");
            let settled = false;
            const done = (val) => {
              if (settled) return;
              settled = true;
              try { delete window[cb]; } catch (e) { window[cb] = undefined; }
              if (sc.parentNode) sc.remove();
              resolve(val || {});
            };
            window[cb] = (d) => {
              const out = {};
              for (const x of (d && d.results) || []) {
                if (x && x.collectionId && x.artworkUrl100) {
                  out[String(x.collectionId)] = smallArt(x.artworkUrl100);
                }
              }
              done(out);
            };
            sc.onerror = () => done({});
            sc.src = "https://itunes.apple.com/lookup?id=" + ids.join(",") + "&country=us&callback=" + cb;
            document.body.appendChild(sc);
            setTimeout(() => done({}), 8000);
          });
        }

        const cached = readCache();
        if (cached) {
          paint(buildFromIds(cached));
          return;
        }

        paint(skeleton); // 先骨架

        (async () => {
          const map = {};
          const CHUNK = 10;
          for (let i = 0; i < IDS.length; i += CHUNK) {
            const chunk = IDS.slice(i, i + CHUNK);
            try {
              const got = await jsonpBatch(chunk);
              // collectionId → 清单里的 artist|album 键
              chunk.forEach((id) => {
                const idxInList = IDS.indexOf(id);
                const pair = ALBUMS[idxInList];
                if (pair && got[String(id)]) {
                  map[pair[0] + "|" + pair[1]] = got[String(id)];
                }
              });
              if (Object.keys(map).length) paint(buildFromIds(map));
            } catch (e) {
              /* 单批失败不影响其他批次 */
            }
            await new Promise((r) => setTimeout(r, 120));
          }
          paint(buildFromIds(map));
          writeCache(map);
        })();
      })();

      // ===== 存储层：IndexedDB（localStorage 只有 5MB，装不下 100 张封面） =====
      const DB_NAME = "lifeline";
      const STORE = "kv";
      let dbPromise = null;
      function openDB() {
        if (dbPromise) return dbPromise;
        dbPromise = new Promise((resolve, reject) => {
          const rq = indexedDB.open(DB_NAME, 1);
          rq.onupgradeneeded = () => {
            if (!rq.result.objectStoreNames.contains(STORE)) rq.result.createObjectStore(STORE);
          };
          rq.onsuccess = () => resolve(rq.result);
          rq.onerror = () => reject(rq.error);
        });
        return dbPromise;
      }
      async function idbSet(key, val) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, "readwrite");
          tx.objectStore(STORE).put(val, key);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      }
      async function idbGet(key) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, "readonly");
          const rq = tx.objectStore(STORE).get(key);
          rq.onsuccess = () => resolve(rq.result);
          rq.onerror = () => reject(rq.error);
        });
      }
      async function idbDel(key) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, "readwrite");
          tx.objectStore(STORE).delete(key);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      }

      let saveTimer = null;
      function save() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(async () => {
          try {
            await idbSet("items", items);
          } catch (e) {
            $("msg").textContent = "本地保存失败（存储空间可能不足），但不影响生成图片。";
          }
        }, 250);
      }

      // ===== 毛玻璃 Toast（停留 1 秒） =====
      let toastTimer = null;
      function toast(msg, icon) {
        const el = $("toast");
        el.innerHTML = '<i>' + (icon || "✓") + "</i><span></span>";
        el.querySelector("span").textContent = msg;
        el.classList.add("on");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove("on"), 1000);
      }
      async function migrate() {
        try {
          const old = localStorage.getItem("top50");
          if (!old) return;
          const arr = JSON.parse(old);
          if (Array.isArray(arr) && arr.length) {
            const cur = await idbGet("items");
            if (!cur || !cur.length) {
              items = arr;
              await idbSet("items", items);
            }
          }
          localStorage.removeItem("top50");
        } catch (e) {}
      }

      (async () => {
        await migrate();
        try {
          const saved = await idbGet("items");
          if (Array.isArray(saved)) items = saved;
        } catch (e) {}
        // 兼容旧数据：旧的紧凑数组里可能没有 null，稀疏模型下无需转换
        if (filledCount() > MAX) MAX = CAPS.find((c) => c >= filledCount()) || 100;
        $("cap").value = String(MAX);
        render();
      })();

      // ===== 交互状态 =====
      // items 为「稀疏槽位」数组：下标即名次，空位为 null
      // 这样才能做到「点第 6 格就填进第 6 名」，而不是被紧凑化前移
      let selectedSlot = -1;   // 已选中的空格子（等待填入的"名次"）
      let replaceTarget = -1;  // 已选中的已有格子（等待替换）
      let dragFrom = -1;       // 长按/拖拽源索引
      let grabAt = 0;          // 抓起的时刻，用于吞掉长按尾随的那一次 click

      const filled = () => items.filter(Boolean);
      const filledCount = () => filled().length;
      const lastFilledIndex = () => {
        for (let i = items.length - 1; i >= 0; i--) if (items[i]) return i;
        return -1;
      };

      function clearSelection() {
        selectedSlot = -1;
        replaceTarget = -1;
      }

      // 长按会在同一格上尾随一次 click（手指抬起时）。
      // 用时间窗判断：抓起后极短时间内的同格 click 不当作「放下」。
      function isTailClick(i) {
        return dragFrom === i && Date.now() - grabAt < 260;
      }
      function dropGrab() {
        dragFrom = -1;
        grabAt = 0;
      }

      function add(it) {
        // 1. 替换模式：直接替换目标名次
        if (replaceTarget >= 0 && items[replaceTarget]) {
          const rank = replaceTarget + 1;
          items[replaceTarget] = it;
          clearSelection();
          save();
          render();
          toast(`已替换第 ${rank} 名`, "↻");
          return;
        }
        // 2. 去重（只看已填格子）
        if (filled().some((x) => x.name === it.name && x.artist === it.artist)) {
          $("msg").textContent = "这张已经在列表里了。";
          toast("已在列表中", "!");
          return;
        }
        // 3. 名额已满
        if (filledCount() >= MAX) {
          $("msg").textContent = "上限是 " + MAX + " 张，先删几张或调高上限。";
          toast("已满 " + MAX + " 张", "!");
          return;
        }
        // 4. 精准填入选中名次；未选则落在最后一个已填之后
        let rank;
        if (selectedSlot >= 0 && selectedSlot < MAX) {
          const at = selectedSlot;
          while (items.length <= at) items.push(null);
          // 该槽若恰好被占（并发情况），顺延到后面第一个空位
          let pos = at;
          while (pos < MAX && items[pos]) pos++;
          if (pos >= MAX) pos = items.length;
          while (items.length <= pos) items.push(null);
          items[pos] = it;
          rank = pos + 1;
        } else {
          const pos = lastFilledIndex() + 1;
          while (items.length <= pos) items.push(null);
          items[pos] = it;
          rank = pos + 1;
        }
        clearSelection();
        save();
        render();
        toast(`已加入第 ${rank} 名`);
      }

      // 上传的图片统一压成 1:1 正方形（居中 cover 裁切），避免变形
      function fileToSquare(file, cb) {
        const fr = new FileReader();
        fr.onload = () => {
          const im = new Image();
          im.onload = () => {
            const c = document.createElement("canvas");
            c.width = c.height = 500;
            const x = c.getContext("2d");
            const s = Math.min(im.width, im.height);
            x.drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, 500, 500);
            cb(c.toDataURL("image/jpeg", 0.85));
          };
          im.onerror = () => cb(null);
          im.src = fr.result;
        };
        fr.onerror = () => cb(null);
        fr.readAsDataURL(file);
      }

      // ===== 格子操作菜单 =====
      function closePop() {
        $("pop").hidden = true;
      }
      function openPop(idx, anchor) {
        const p = $("pop");
        p.innerHTML = "";
        const mk = (label, danger, fn) => {
          const b = document.createElement("button");
          b.textContent = label;
          if (danger) b.className = "danger";
          b.onclick = () => {
            closePop();
            fn();
          };
          p.appendChild(b);
        };
        mk("用搜索结果替换", false, () => {
          replaceTarget = idx;
          selectedSlot = -1;
          render();
          toast(`已选中第 ${idx + 1} 名，点搜索结果即可替换`, "⊕");
        });
        mk("上传图片替换", false, () => {
          replaceTarget = idx;
          $("rf").value = "";
          $("rf").click();
        });
        mk("删除这张", true, () => {
          const rank = idx + 1;
          items[idx] = null;
          clearSelection();
          save();
          render();
          toast(`已删除第 ${rank} 名`, "✕");
        });

        p.hidden = false;
        // 定位：优先贴格子下方，超出视口则上翻
        const r = anchor.getBoundingClientRect();
        const pr = p.getBoundingClientRect();
        let left = r.left + r.width / 2 - pr.width / 2;
        let top = r.bottom + 6;
        left = Math.max(8, Math.min(left, window.innerWidth - pr.width - 8));
        if (top + pr.height > window.innerHeight - 8) top = Math.max(8, r.top - pr.height - 6);
        p.style.left = left + "px";
        p.style.top = top + "px";
      }

      $("cap").onchange = () => {
        const v = +$("cap").value;
        MAX = v;
        try {
          localStorage.setItem(CAP_KEY, String(v));
        } catch (e) {}
        clearSelection();
        // 超出上限的槽位直接丢弃（保留前 MAX 个名次）
        if (items.length > MAX) {
          const over = filled().length - items.slice(0, MAX).filter(Boolean).length;
          items = items.slice(0, MAX);
          save();
          if (over > 0) toast(`上限改为 ${MAX} 张，超出的 ${over} 张已裁掉`, "!");
        }
        render();
      };

      function render(opts) {
        const g = $("grid");
        g.innerHTML = "";
        const keepScroll = opts && opts.keepScroll ? window.scrollY : null;

        // 列数自适应：让空位尽量少，最多 12 列
        const wide = window.innerWidth >= 700;
        let cols;
        if (isPerfectSquare(MAX)) {
          // 平方数：直接 √N × √N，绝不出现空洞
          cols = Math.round(Math.sqrt(MAX));
        } else if (MAX <= 9) cols = wide ? 5 : 3;
        else if (MAX <= 16) cols = wide ? 8 : 4;
        else if (MAX <= 25) cols = wide ? 9 : 4;
        else if (MAX <= 50) cols = wide ? 10 : 5;
        else cols = wide ? 12 : 6;
        // 非平方数：选能整除 MAX、或余数最小的列数，减少末行空洞
        if (!isPerfectSquare(MAX)) {
          const cands = wide ? [12, 11, 10, 9, 8, 7, 6, 5] : [6, 5, 4, 3];
          let bestCols = cols, bestHole = MAX % cols === 0 ? 0 : cols - (MAX % cols);
          for (const c of cands) {
            const hole = MAX % c === 0 ? 0 : c - (MAX % c);
            // 优先：余数为 0；其次空洞更少且列数不过窄
            if (hole < bestHole) { bestHole = hole; bestCols = c; }
            else if (hole === bestHole && Math.abs(c - cols) < Math.abs(bestCols - cols)) bestCols = c;
          }
          cols = bestCols;
        }
        g.style.setProperty("--cols", String(cols));

        for (let i = 0; i < MAX; i++) {
          const cell = document.createElement("div");
          cell.className = "s";
          cell.dataset.idx = String(i);
          const it = items[i];

          if (it) {
            cell.draggable = true;
            cell.title = it.name + (it.artist ? " - " + it.artist : "");
            cell.dataset.tip = "第 " + (i + 1) + " 名\n点按替换或删除";
            const im = document.createElement("img");
            im.alt = "";
            im.src = it.src;
            const u = document.createElement("u");
            u.textContent = String(i + 1);
            cell.appendChild(im);
            cell.appendChild(u);

            const del = document.createElement("i");
            del.textContent = "×";
            del.title = "删除";
            del.onclick = (e) => {
              e.stopPropagation();
              items[i] = null; // 稀疏：留空位而非前移，名次不串位
              clearSelection();
              save();
              render();
              toast(`已删除第 ${i + 1} 名`, "✕");
            };
            cell.appendChild(del);

            // 桌面：原生拖拽
            cell.ondragstart = (e) => {
              dragFrom = i;
              grabAt = Date.now();
              cell.classList.add("dragging");
              e.dataTransfer.setData("text/plain", String(i));
              e.dataTransfer.effectAllowed = "move";
            };
            cell.ondragend = () => {
              cell.classList.remove("dragging");
              dropGrab();
              $("grid").classList.remove("moving");
            };

            // 点按已有图片：打开操作菜单
            cell.onclick = () => {
              // 长按抬起时的尾随 click：不当作放下
              if (isTailClick(i)) return;
              // 移动模式：已有图片也可作为落点（交换）；点自己则取消
              if (dragFrom >= 0) {
                if (dragFrom === i) { dropGrab(); render({ keepScroll: true }); toast("已取消移动", "·"); return; }
                moveItem(dragFrom, i);
                return;
              }
              const p = $("pop");
              if (!p.hidden && p.dataset.idx === String(i)) {
                closePop();
                return;
              }
              p.dataset.idx = String(i);
              openPop(i, cell);
            };
          } else {
            // 空格子：显示浅色名次，点按选中
            const u = document.createElement("u");
            u.textContent = String(i + 1);
            u.style.opacity = "0.35";
            u.style.color = "var(--mute)";
            u.style.textShadow = "none";
            cell.appendChild(u);
            cell.dataset.tip = "填入第 " + (i + 1) + " 名";
            cell.onclick = () => {
              // 长按抬起时的尾随 click：不当作放下
              if (isTailClick(i)) return;
              // 移动模式：点空格子也作为落点
              if (dragFrom >= 0) {
                if (dragFrom === i) { dropGrab(); render({ keepScroll: true }); toast("已取消移动", "·"); return; }
                moveItem(dragFrom, i);
                return;
              }
              selectedSlot = selectedSlot === i ? -1 : i;
              replaceTarget = -1;
              closePop();
              render({ keepScroll: true });
              toast(
                selectedSlot >= 0
                  ? `已选中第 ${i + 1} 名，点搜索结果填入`
                  : "已取消选择",
                selectedSlot >= 0 ? "⊙" : "·"
              );
            };
          }

          // 选中高亮
          if (i === selectedSlot || i === replaceTarget) cell.classList.add("sel");

          // 拖放（桌面）
          cell.ondragover = (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
          };
          cell.ondrop = (e) => {
            e.preventDefault();
            const a = +e.dataTransfer.getData("text/plain");
            moveItem(a, i);
          };

          // 长按进入移动模式（触屏友好）
          bindLongPress(cell, i);

          g.appendChild(cell);
        }

        $("cnt").textContent = filledCount() + " / " + MAX;
        // 抓起状态：整格网提示可放置
        g.classList.toggle("moving", dragFrom >= 0);
        if (keepScroll !== null) window.scrollTo(0, keepScroll);
      }

      // 交换两个槽位（稀疏安全：任一侧可为空）
      function moveItem(from, to) {
        if (!(from >= 0) || isNaN(from) || from >= MAX) return;
        const target = Math.min(Math.max(to, 0), MAX - 1);
        if (target === from) {
          dropGrab();
          render({ keepScroll: true });
          return;
        }
        if (!items[from]) { dropGrab(); return; }
        while (items.length <= Math.max(from, target)) items.push(null);
        const a = items[from];
        const b = items[target];
        items[target] = a;
        items[from] = b; // 目标原内容挪到源位置（交换），保证不丢数据
        dropGrab();
        clearSelection();
        save();
        render({ keepScroll: true });
        toast(b ? `已与第 ${target + 1} 名交换` : `已移到第 ${target + 1} 名`, "⇅");
      }

      // 长按 350ms 进入移动模式；之后点目标格子完成移动
      function bindLongPress(cell, i) {
        let timer = null;
        let moved = false;
        const start = () => {
          if (!items[i]) return; // 空格子不触发长按拖拽
          if (dragFrom >= 0) return; // 已在抓取中，不重复触发
          moved = false;
          clearTimeout(timer);
          timer = setTimeout(() => {
            if (moved) return;
            dragFrom = i;
            grabAt = Date.now();
            cell.classList.add("dragging");
            $("grid").classList.add("moving");
            toast(`已抓起第 ${i + 1} 名，点目标格子放下`, "⇅");
          }, 350);
        };
        const cancel = () => clearTimeout(timer);
        cell.addEventListener("touchstart", start, { passive: true });
        cell.addEventListener("touchmove", () => {
          moved = true;
          cancel();
        }, { passive: true });
        cell.addEventListener("touchend", cancel);
        cell.addEventListener("mousedown", start);
        cell.addEventListener("mouseup", cancel);
        cell.addEventListener("mouseleave", cancel);
        cell.addEventListener("contextmenu", (e) => {
          // 移动端长按会弹系统菜单，抓起状态下屏蔽掉
          if (dragFrom >= 0) e.preventDefault();
        });
      }

      function jsonp(url) {
        return new Promise((res, rej) => {
          const cb = "cb" + Date.now(),
            sc = document.createElement("script");
          window[cb] = (d) => {
            res(d);
            sc.remove();
            delete window[cb];
          };
          sc.onerror = () => {
            rej(new Error("网络被拦截"));
            sc.remove();
          };
          sc.src = url + "&callback=" + cb;
          document.body.appendChild(sc);
          setTimeout(() => rej(new Error("超时")), 10000);
        });
      }

      async function apiGet(u) {
        try {
          const r = await fetch(u, { mode: "cors" });
          if (!r.ok) throw new Error("HTTP " + r.status);
          return await r.json();
        } catch (e) {
          return await jsonp(u);
        }
      }

      async function search() {
        const q = $("q").value.trim();
        if (!q) return;

        // 地区固定为美国（原地区下拉框已移除）
        const cty = "us";
        const NAME = { tw: "中国台湾", hk: "中国香港", sg: "新加坡", jp: "日本", us: "美国", gb: "英国" };
        const BASE = "https://itunes.apple.com/";

        $("msg").textContent = "搜索中…";
        $("res").innerHTML = "";

        const NOISE = /karaoke|instrumental|tribute|performs|piano dreamers|lullaby/i;

        function norm(list) {
          const seen = new Set();
          return list
            .filter((a) => a && a.collectionName && a.artworkUrl100)
            .filter((a) => !NOISE.test(a.collectionName))
            .filter((a) => {
              const k = a.collectionName.trim().toLowerCase();
              if (seen.has(k)) return false;
              seen.add(k);
              return true;
            })
            .sort((a, b) => String(a.releaseDate || "").localeCompare(String(b.releaseDate || "")))
            .map((a) => ({
              name: String(a.collectionName).replace(/ - (Single|EP)$/, ""),
              artist: String(a.artistName || ""),
              src: String(a.artworkUrl100).replace("100x100bb", "600x600bb"),
              thumb: String(a.artworkUrl100),
              date: String(a.releaseDate || "").slice(0, 4),
            }));
        }

        try {
          let cards = [];
          let head = "";
          let artist = null;

          try {
            const s = await apiGet(BASE + "search?entity=musicArtist&limit=5&country=" + cty + "&term=" + encodeURIComponent(q));
            if (s.resultCount) artist = s.results[0];
          } catch (e) {}

          if (artist) {
            const d = await apiGet(BASE + "lookup?id=" + artist.artistId + "&entity=album&limit=200&country=" + cty);
            const cols = (d.results || []).filter((x) => x.wrapperType === "collection" && (x.trackCount || 0) >= 4);
            cards = norm(cols);
            if (cards.length) head = artist.artistName + "　" + cards.length + " 张专辑 / EP";
          }

          if (!cards.length) {
            const d = await apiGet(BASE + "search?entity=album&limit=30&country=" + cty + "&term=" + encodeURIComponent(q));
            cards = norm(d.results || []);
            if (cards.length) head = "「" + q + "」的搜索结果　" + cards.length + " 张";
          }

          if (!cards.length) {
            $("msg").textContent = "在「" + NAME[cty] + "」库里没搜到。换个关键词试试，或用下方“手动添加”。";
            return;
          }

          $("msg").textContent = head + "（当前地区：" + NAME[cty] + "）";

          cards.forEach((c) => {
            const b = document.createElement("button");
            b.className = "c";
            b.innerHTML = '<img loading="lazy" alt=""><div><b></b><span></span></div>';
            b.querySelector("img").src = c.thumb;
            b.querySelector("b").textContent = c.name;
            b.querySelector("span").textContent = c.artist + (c.date ? "　" + c.date : "");
            b.onclick = () => {
              // 按压缩放动画
              b.classList.remove("pulse");
              void b.offsetWidth; // 强制重排以便重播动画
              b.classList.add("pulse");
              b.addEventListener("animationend", () => b.classList.remove("pulse"), { once: true });
              add({ name: c.name, artist: c.artist, src: c.src });
            };
            $("res").appendChild(b);
          });
        } catch (e) {
          $("msg").textContent = "搜索失败（" + (e.message || e) + "）。换个关键词重试，或用下方手动添加。";
        }
      }

      $("go").onclick = search;
      $("q").onkeydown = (e) => {
        if (e.key === "Enter") search();
      };

      $("madd").onclick = () => {
        const f = $("f").files[0], n = $("mn").value.trim(), a = $("ma").value.trim();
        if (!f || !n) {
          $("msg").textContent = "请选择图片并填写专辑名。";
          return;
        }
        fileToSquare(f, (dataUrl) => {
          if (!dataUrl) {
            $("msg").textContent = "图片读取失败，请换一张。";
            return;
          }
          add({ name: n, artist: a, src: dataUrl });
          $("mn").value = "";
          $("ma").value = "";
          $("f").value = "";
        });
      };

      // 替换用：上传图片替换选中的格子
      $("rf").onchange = () => {
        const f = $("rf").files[0];
        const idx = replaceTarget;
        if (!f || idx < 0) return;
        fileToSquare(f, (dataUrl) => {
          if (!dataUrl) {
            toast("图片读取失败", "!");
            return;
          }
          if (items[idx]) {
            items[idx].src = dataUrl;
            save();
            render();
            toast(`已替换第 ${idx + 1} 名的封面`, "↻");
          } else {
            // 目标槽已空：当作新增填入该名次
            const keep = selectedSlot;
            selectedSlot = idx;
            add({ name: "自选封面", artist: "", src: dataUrl });
            selectedSlot = keep;
          }
          clearSelection();
          render();
        });
      };

      // 点击空白处关闭菜单 / 取消选择 / 退出抓取
      document.addEventListener("click", (e) => {
        const p = $("pop");
        if (!p.hidden && !p.contains(e.target) && !e.target.closest(".s")) closePop();
        if (!e.target.closest(".s") && !e.target.closest(".pop") && dragFrom >= 0) {
          dropGrab();
          render({ keepScroll: true });
          toast("已取消移动", "·");
        }
      });
      // Esc 退出抓取 / 关闭菜单
      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        if (!$("pop").hidden) { closePop(); return; }
        if (dragFrom >= 0) {
          dropGrab();
          render({ keepScroll: true });
          toast("已取消移动", "·");
        }
      });
      window.addEventListener("scroll", () => {
        if (!$("pop").hidden) closePop();
      });

      // ===== 背景墙随滚动逐层压暗（纯视觉，不改任何业务逻辑） =====
      (function initVeil() {
        const veil = $("veil");
        if (!veil) return;
        let raf = 0;
        const apply = () => {
          raf = 0;
          // 滚动 120px 起步，到 460px 完全遮住背景墙
          const y = window.scrollY || window.pageYOffset || 0;
          const t = Math.max(0, Math.min(1, (y - 120) / 340));
          veil.style.opacity = String(t * 0.96);
        };
        window.addEventListener(
          "scroll",
          () => {
            if (!raf) raf = requestAnimationFrame(apply);
          },
          { passive: true }
        );
        apply();
      })();

      function fit(x, t, w) {
        if (x.measureText(t).width <= w) return t;
        while (t.length > 1 && x.measureText(t + "…").width > w) t = t.slice(0, -1);
        return t + "…";
      }

      // ===== 图片内存缓存 =====
      // 即选即看的核心：改主题/字体时不重新下载封面，直接从 Map 里取。
      // 值为 Promise（而不是已完成的 Image），这样并发请求同一张图只会发一次。
      const imageCache = new Map();

      function load(src) {
        if (!src) return Promise.resolve(null);
        const hit = imageCache.get(src);
        if (hit) return hit;

        const p = new Promise(async (resolve) => {
          const timer = setTimeout(() => resolve(null), 6000);
          try {
            const b = src.startsWith("data:")
              ? await (await fetch(src)).blob()
              : await (await fetch(src, { mode: "cors" })).blob();
            const img = await createImageBitmap(b);
            clearTimeout(timer);
            resolve(img);
          } catch (e) {
            const im = new Image();
            im.crossOrigin = "anonymous";
            im.onload = () => { clearTimeout(timer); resolve(im); };
            im.onerror = () => { clearTimeout(timer); resolve(null); };
            im.src = src;
          }
        });
        imageCache.set(src, p);
        // 加载失败的结果不留缓存，下次重绘还有机会重试
        p.then((v) => { if (!v) imageCache.delete(src); });
        return p;
      }

      // ===== 排版引擎 =====
      // 目标：阶梯式（前排大、后排小）、严格递增、总数守恒、无空洞
      const LAY = { W: 2400, pad: 100, gap: 8, head: 280 };
      LAY.cw = LAY.W - LAY.pad * 2;
      const cellSize = (cols) => (LAY.cw - (cols - 1) * LAY.gap) / cols;
      const strictInc = (a) => a.every((v, i) => i === 0 || v > a[i - 1]);

      // 等比裁切绘制：保持 1:1 正方形且不变形（居中 cover）
      function drawCover(ctx, img, dx, dy, size) {
        const iw = img.width || img.naturalWidth;
        const ih = img.height || img.naturalHeight;
        if (!iw || !ih) {
          ctx.fillStyle = "#333";
          ctx.fillRect(dx, dy, size, size);
          return;
        }
        const scale = Math.max(size / iw, size / ih);
        const sw = size / scale;
        const sh = size / scale;
        const sx = (iw - sw) / 2;
        const sy = (ih - sh) / 2;
        ctx.drawImage(img, sx, sy, sw, sh, dx, dy, size, size);
      }

      // 给定 行数R / 总数N / 相邻行缩放比k，生成严格递增且和为N的行数数组
      function geomRows(R, N, k) {
        let lo = 0.1, hi = N / R, C = 0;
        for (let t = 0; t < 60; t++) {
          C = (lo + hi) / 2;
          let s = 0;
          for (let i = 0; i < R; i++) s += Math.max(1, Math.round(C * Math.pow(k, i)));
          if (s < N) lo = C; else hi = C;
        }
        for (const C0 of [C, (lo + hi) / 2, lo, hi]) {
          const c = [];
          for (let i = 0; i < R; i++) c.push(Math.max(1, Math.round(C0 * Math.pow(k, i))));
          let d = N - c.reduce((a, b) => a + b, 0), guard = 0;
          while (d > 0 && guard++ < 4000) {
            for (let j = R - 1; j >= 0 && d > 0; j--) {
              const cap = j === R - 1 ? Infinity : c[j + 1] - 1;
              if (c[j] + 1 <= cap) { c[j]++; d--; }
            }
          }
          while (d < 0 && guard++ < 8000) {
            for (let j = 0; j < R && d < 0; j++) {
              const floor = j === 0 ? 1 : c[j - 1] + 1;
              if (c[j] - 1 >= floor) { c[j]--; d++; }
            }
          }
          if (d === 0 && strictInc(c)) return c;
        }
        return null;
      }

      function layoutCost(c, N) {
        const R = c.length;
        const sz = c.map(cellSize);
        const s0 = sz[0], s1 = sz[R - 1];
        const ratio = s0 / s1;
        let dev = 0;
        for (let i = 1; i < R; i++) dev += Math.abs(Math.log(sz[i - 1] / sz[i]));
        dev = R > 1 ? dev / (R - 1) : 0;
        let varz = 0;
        if (R > 2) {
          const rs = [];
          for (let i = 1; i < R; i++) rs.push(Math.log(sz[i - 1] / sz[i]));
          const m = rs.reduce((a, b) => a + b, 0) / rs.length;
          varz = Math.sqrt(rs.reduce((a, b) => a + (b - m) ** 2, 0) / rs.length);
        }
        let k = 0;
        k += Math.abs(ratio - 2.25) * 4.0;              // 阶梯总陡度
        k += Math.max(0, ratio - 3.4) * 7;              // 太陡
        k += Math.max(0, 1.75 - ratio) * 12;            // 太平
        k += varz * 6;                                  // 台阶不均匀
        k += Math.max(0, dev - 0.3) * 10;               // 单级跳变过大
        k += Math.max(0, 2 - c[0]) * (N >= 3 ? 9 : 0);  // 首行至少 2 个（否则一张占满整宽，画幅被拉成超长竖条）
        k += Math.max(0, c[0] - 10) * 1.2;              // 首行别太多
        k += s0 > 1000 ? (s0 - 1000) / 150 : 0;         // 首图别过大
        k += s1 < 200 ? (200 - s1) / 40 : 0;            // 尾图别过小
        const idealR = Math.max(2, Math.round(Math.sqrt(N) / 1.7));
        k += Math.abs(R - idealR) * 1.6;

        // 画幅比例约束：每行都铺满画布宽度，行数少时整幅会变成超宽横条。
        // 让成品尽量落在 3:2 ~ 4:5 的舒服区间，避免 N 相邻却一个偏方一个偏条。
        const H = LAY.head + LAY.pad + sz.reduce((a, h) => a + h + LAY.gap, -LAY.gap);
        const shape = H / LAY.W;               // 高/宽
        k += Math.max(0, 0.62 - shape) * 26;   // 太扁（横条）
        k += Math.max(0, shape - 1.15) * 14;   // 太高（竖条）
        return k;
      }

      // 返回每一行的列数数组，sum === N
      function planRows(N) {
        if (N <= 0) return [];
        let best = null;
        for (let R = 1; R <= Math.min(N, 8); R++) {
          for (const k of [1.05, 1.09, 1.13, 1.17, 1.21, 1.26, 1.32, 1.4, 1.5]) {
            const c = geomRows(R, N, k);
            if (!c || c.length !== R) continue;
            const sc = layoutCost(c, N);
            if (!best || sc < best.sc) best = { c, sc };
          }
        }
        return best ? best.c : [N];
      }

      // 全局缓存，避免重复寻优
      const planCache = new Map();
      const plan = (N) => {
        if (!planCache.has(N)) planCache.set(N, planRows(N));
        return planCache.get(N);
      };

      // ===== 正方形网格：N 为完全平方数时，排成 √N × √N =====
      // 用函数声明（会被提升）：render() 在模块初始化早期就可能被调用
      function isPerfectSquare(n) {
        if (n < 1) return false;
        const r = Math.round(Math.sqrt(n));
        return r * r === n;
      }

      // 返回 { mode, counts, head, gap, pad, W, H }
      // mode = "square"：等大方块网格，画幅为正方形；mode = "stair"：阶梯
      function buildLayout(N, textMode, layoutPref) {
        const autoSquare = isPerfectSquare(N);
        const useSquare =
          layoutPref === "square" ? true : layoutPref === "stair" ? false : autoSquare;

        if (useSquare) {
          const side = Math.round(Math.sqrt(N));
          const gap = 8;
          const textModeOn = !!textMode;
          const L = 2400; // 目标正方形边长

          // 结构的核心：标题块紧贴网格上方（不随格子尺寸变化），
          // 剩余空间平均分给上下留白 —— 这样无论 N 多大，视觉重心都是居中的。
          const TB = 200;   // 标题区总高：题名 + 副题 + 到网格的间距
          const PREF = 110; // 参考上下留白
          // 网格目标高度
          const gridTarget = L - PREF * 2 - TB;

          const fontOf = (s) => Math.max(11, Math.min(26, s * 0.075));
          const rowHOf = (s) => s + (textModeOn ? fontOf(s) * 2.6 : 0);
          const gridHOf = (s) => side * rowHOf(s) + (side - 1) * gap;

          // 二分求 s，使网格高度恰好为 gridTarget（随 s 单调递增）
          let lo = 20, hi = L, s = 100;
          for (let t = 0; t < 90; t++) {
            s = (lo + hi) / 2;
            if (gridHOf(s) < gridTarget) lo = s; else hi = s;
          }
          s = lo; // 保守取小者，保证不超高

          const f = fontOf(s);
          const rowH = rowHOf(s);
          const gridW = side * s + (side - 1) * gap;
          const gridH = gridHOf(s);

          // 上下留白完全对称，画幅严格 2400×2400
          const padY = (L - TB - gridH) / 2;
          // 横向：格子为正方形，多余宽度作为左右边距
          const padX = (L - gridW) / 2;

          return {
            mode: "square",
            side,
            counts: new Array(side).fill(side),
            s,
            gap,
            pad: padX,
            padY,
            contentLeft: padX,
            W: L,
            H: L,
            head: padY + TB,
            baseFont: f,
            cap: textModeOn ? f * 2.6 : 0,
            textMode: textModeOn,
            titleY: padY + 78,
            subY: padY + 144,
          };
        }
        // 阶梯
        const counts = plan(N);
        const rowHeights = counts.map(cellSize);
        const textModeOn = !!textMode;
        const minCell = Math.min(...rowHeights);
        const baseFont = Math.max(11, Math.min(26, minCell * 0.075));
        const cap = textModeOn ? baseFont * 2.6 : 0;
        let H = LAY.head + LAY.pad;
        rowHeights.forEach((h) => (H += h + cap + LAY.gap));
        H -= LAY.gap;
        return {
          mode: "stair",
          counts,
          sizes: rowHeights,
          gap: LAY.gap,
          pad: LAY.pad,
          padY: LAY.pad,
          W: LAY.W,
          H: Math.round(H),
          head: LAY.head,
          titleY: LAY.pad + 60,
          subY: LAY.pad + 120,
          baseFont,
          cap,
          textMode: textModeOn,
        };
      }

      // ===== 背景主题 =====
      // 每个主题给出一整套配色，白底时专辑文字/作者必须自动转深色，
      // 否则会糊成一片看不见。draw 是"额外的背景绘制"钩子（毛玻璃用）。
      const themes = {
        dark: {
          bg: "#111111",
          titleColor: "#ffffff",
          authorColor: "#aaaaaa",
          albumTextColor: "#e0e0e0",
          albumArtistColor: "#888888",
          emptyCell: "#2a2a2d",
        },
        light: {
          bg: "#f5f5f5",
          titleColor: "#111111",
          authorColor: "#6b6b6b",
          albumTextColor: "#1a1a1a",
          albumArtistColor: "#7a7a7a",
          emptyCell: "#dcdcdc",
        },
        glass: {
          bg: "#0a0a0c",
          titleColor: "#ffffff",
          authorColor: "#b9b9c4",
          albumTextColor: "#e4e4ea",
          albumArtistColor: "#9a9aa6",
          emptyCell: "#242428",
        },
      };

      // ===== 标题字体 =====
      // stack 里把中文可用字体排在前面，英文名字（Bebas/Montserrat…）
      // 缺中文字符时会自动回落到后面的系统中文字体，不会出豆腐块。
      const SYS_CN = '"PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC"';
      const fonts = {
        system: { stack: `-apple-system, "Helvetica Neue", ${SYS_CN}, sans-serif`, weight: 800 },
        smiley: { stack: `"Smiley Sans", ${SYS_CN}, sans-serif`, weight: 400 },
        alimama: { stack: `"Alimama ShuHeiTi", ${SYS_CN}, sans-serif`, weight: 900 },
        noto: { stack: `"Noto Sans SC", ${SYS_CN}, sans-serif`, weight: 900 },
        bebas: { stack: `"Bebas Neue", ${SYS_CN}, sans-serif`, weight: 400 },
        montserrat: { stack: `"Montserrat", ${SYS_CN}, sans-serif`, weight: 800 },
        darker: { stack: `"Darker Grotesque", ${SYS_CN}, sans-serif`, weight: 800 },
        nunito: { stack: `"Nunito", ${SYS_CN}, sans-serif`, weight: 800 },
        boldonse: { stack: `"Boldonse", ${SYS_CN}, sans-serif`, weight: 400 },
      };

      // 中文字库体积大（得意黑 1.15MB、阿里妈妈 594KB、思源 100+ 分片），
      // 只有用户真的选了才去 fetch；这里用 FontFace API 精确控制加载时机。
      const FONT_URLS = {
        "Smiley Sans":
          "https://cdn.jsdelivr.net/npm/@fontpkg/smiley-sans@2.0.4/SmileySans-Oblique.ttf.woff2",
        "Alimama ShuHeiTi":
          "https://cdn.jsdelivr.net/npm/@fontpkg/alimama-shu-hei-ti@1.0.5/AlimamaShuHeiTi-Bold.woff2",
      };
      const fontJobs = new Map();
      /**
       * 确保字体可用于 canvas 绘制。
       * 注意：document.fonts.check() 对「按 unicode-range 分片」的字体
       * （思源黑体就是 101 个分片）不可靠 —— 分片未下载时它会返回 false，
       * 即使字体声明完全正常。所以统一用 fonts.load(font, sampleText) 主动拉取，
       * 它只下载 sampleText 命中的那几个分片，比整包快得多。
       */
      function ensureFont(key, sampleText) {
        const sample = sampleText || "Top Albums of My Life 中文专辑";
        const weightOf = {
          smiley: 400, alimama: 900, noto: 900,
          bebas: 400, boldonse: 400, montserrat: 800, darker: 800, nunito: 800,
        };
        // 去掉引号的 family 名，fonts.load 和 @font-face 都要能对上
        const famRaw = (fonts[key] && fonts[key].stack || "").split(",")[0].trim().replace(/^["']|["']$/g, "");
        if (!famRaw || famRaw === "-apple-system") return Promise.resolve(); // 系统字体无需等待

        const weight = weightOf[key] || 400;
        const jobKey = famRaw + "|" + weight;
        if (fontJobs.has(jobKey)) return fontJobs.get(jobKey);

        const job = new Promise((resolve) => {
          let settled = false;
          const done = () => { if (!settled) { settled = true; resolve(); } };
          // 关键：必须显式 fonts.load 才会去下载字体文件。
          // 光等 document.fonts.ready 是不够的 —— 它只等「已开始的」加载，
          // 而字体要等第一次真正绘制时才懒加载，于是首帧就用回退字画了。
          document.fonts
            .load(`${weight} 80px "${famRaw}"`, sample)
            .then((faces) => {
              if (faces && faces.length) return done();
              return loadByApi(famRaw, key).then(done);
            })
            .catch(() => loadByApi(famRaw, key).then(done));
          // 兜底超时：网络太差也不卡住出图
          setTimeout(done, 5000);
        });
        fontJobs.set(jobKey, job);
        return job;
      }

      // 兜底：直接用二进制构造 FontFace（仅中文字库有直链可用）
      function loadByApi(fam, key) {
        const url = FONT_URLS[fam];
        if (!url) return Promise.resolve();
        return new FontFace(fam, `url("${url}")`, {
          weight: key === "alimama" ? "900" : "400",
          display: "swap",
        })
          .load()
          .then((f) => document.fonts.add(f))
          .catch(() => {});
      }

      // 主题背景：毛玻璃用极暗底色 + 多组径向渐变模拟光斑
      function paintBackground(ctx, W, H, themeKey) {
        if (themeKey !== "glass") {
          ctx.fillStyle = themes[themeKey].bg;
          ctx.fillRect(0, 0, W, H);
          return;
        }
        const base = ctx.createLinearGradient(0, 0, W, H);
        base.addColorStop(0, "#1d1d33");
        base.addColorStop(0.45, "#0c0c12");
        base.addColorStop(1, "#231a2b");
        ctx.fillStyle = base;
        ctx.fillRect(0, 0, W, H);

        // 三团柔光，位置不同、色相微差，叠出玻璃后的折射感。
        // 浓度必须够：海报最终是按 1/4 甚至更小缩略看，太淡就等同纯黑。
        const blobs = [
          { x: W * 0.15, y: H * 0.08, r: W * 0.62, c: "rgba(96,120,255,0.42)" },
          { x: W * 0.92, y: H * 0.26, r: W * 0.55, c: "rgba(255,96,180,0.34)" },
          { x: W * 0.48, y: H * 1.0, r: W * 0.70, c: "rgba(80,240,205,0.26)" },
          { x: W * 0.05, y: H * 0.75, r: W * 0.42, c: "rgba(140,90,255,0.28)" },
        ];
        for (const b of blobs) {
          const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
          g.addColorStop(0, b.c);
          g.addColorStop(0.55, b.c.replace(/[\d.]+\)$/, "0.09)"));
          g.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, H);
        }

        // 顶部一道极淡的玻璃高光，模拟受光面
        const gloss = ctx.createLinearGradient(0, 0, 0, H * 0.42);
        gloss.addColorStop(0, "rgba(255,255,255,0.13)");
        gloss.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = gloss;
        ctx.fillRect(0, 0, W, H * 0.42);

        // 细噪点打散渐变的色带（很淡，只为质感）
        ctx.save();
        ctx.globalAlpha = 0.055;
        for (let i = 0; i < 3200; i++) {
          const px = Math.random() * W;
          const py = Math.random() * H;
          const r = Math.random() * 2.4 + 0.6;
          ctx.fillStyle = Math.random() > 0.5 ? "#ffffff" : "#000000";
          ctx.beginPath();
          ctx.arc(px, py, r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // ===== 渲染状态 =====
      // hasRendered：画布上是否已有内容（决定改下拉框时是否自动重绘）
      // posterData：上一次绘制用的快照，即选即看时直接复用，不再重新下载封面
      let hasRendered = false;
      let posterData = null; // { pick, imgs, L, miss }
      let redrawTimer = null;

      // ===== 加载遮罩 =====
      let veilShownAt = 0;
      const VEIL_MIN_MS = 520; // 最短显示时长

      function showVeil() {
        const v = $("drawVeil");
        if (!v) return;
        veilShownAt = performance.now();
        v.hidden = false;
        void v.offsetWidth; // 强制回流，否则 transition 不触发
        v.classList.add("on");
      }

      function hideVeil() {
        const v = $("drawVeil");
        if (!v || v.hidden) return;
        // 渲染太快（实测 16 张封面只要 ~100ms）时遮罩会一闪而过，
        // 观感更像"闪屏抖动"而不是"加载"。压到最短 520ms 再淡出，
        // 反而更沉稳；真正的重绘（图像下载）耗时远超这个值，不会造成延迟感。
        const wait = Math.max(0, VEIL_MIN_MS - (performance.now() - veilShownAt));
        setTimeout(() => {
          v.classList.remove("on");
          setTimeout(() => {
            if (!v.classList.contains("on")) v.hidden = true;
          }, 340);
        }, wait);
      }

      /**
       * 绘制海报
       * @param {boolean} isFirstTime
       *   true  = 首次生成 / 专辑变动后重新生成 → 显示遮罩、加载封面
       *   false = 改主题/字体/布局触发的「即选即看」→ 无遮罩、纯内存重绘
       */
      async function renderPoster(isFirstTime) {
        const pick = filled();
        if (!pick.length) {
          $("warn").textContent = "先添加几张专辑。";
          hideVeil();
          return;
        }

        const themeKey = $("themeSel").value;
        const fontKey = $("fontSel").value;
        const theme = themes[themeKey] || themes.dark;

        if (isFirstTime) {
          showVeil();
          $("warn").textContent = "正在计算完美排版...";
        }

        try {
          // 字体：中文字库按需拉取；document.fonts.ready 确保 canvas 拿到真字体
          // （否则第一次绘制会用回落的系统字体，字重差异很明显）
          // 传入标题/作者文字，让分片字体只下载真正要画的那些字
          const titleTxt = $("title").value.trim() || "Top Albums of My Life";
          const authorTxt = $("author").value.trim();
          await ensureFont(fontKey, titleTxt + " by " + authorTxt + " 0123456789");
          try {
            await document.fonts.ready;
          } catch (e) {}

          const showInfo = $("showInfo").value === "1";
          const layoutPref = $("layoutSel").value;
          const total = pick.length;
          const L = buildLayout(total, showInfo, layoutPref);

          // 图片：首次走网络 + 写入 imageCache；即选即看时全部命中缓存
          let imgs;
          if (isFirstTime || !posterData) {
            imgs = [];
            for (let i = 0; i < pick.length; i++) {
              $("warn").textContent = `正在加载封面：${i + 1} / ${pick.length}`;
              imgs.push(await load(pick[i].src));
            }
          } else {
            imgs = await Promise.all(pick.map((it) => load(it.src)));
          }

          const W = L.W;
          const padY = L.padY || L.pad;
          const gap = L.gap;
          const baseFont = L.baseFont;
          const cap = L.textMode ? baseFont * 2.6 : 0;
          const fontDef = fonts[fontKey] || fonts.system;

          const cv = $("cv");
          cv.width = W;
          cv.height = L.H;
          const x = cv.getContext("2d");

          // 背景（毛玻璃主题在这里叠加渐变与光斑）
          paintBackground(x, W, L.H, themeKey);

          // 标题与作者：位置由布局给出，保证方形画幅下也不贴边
          const titleY = L.titleY || padY + 60;
          const subY = L.subY || padY + 120;
          const leftX = L.contentLeft !== undefined ? L.contentLeft : L.padY;

          x.textBaseline = "alphabetic";
          x.fillStyle = theme.titleColor;
          x.font = `${fontDef.weight} 80px ${fontDef.stack}`;
          // 只有全大写的拉丁展示字体才转大写；中文标题转了没意义
          const isLatinCaps =
            fontKey === "bebas" || fontKey === "boldonse" || fontKey === "montserrat";
          x.fillText(isLatinCaps ? titleTxt.toUpperCase() : titleTxt, leftX, titleY);

          const authorText = authorTxt;
          if (authorText) {
            x.fillStyle = theme.authorColor;
            x.font = `400 36px -apple-system, "Helvetica Neue", ${SYS_CN}, sans-serif`;
            x.fillText("by " + authorText, leftX, subY);
          }

          if (isFirstTime) $("warn").textContent = "正在绘制最终海报...";

          let miss = 0;
          let y = L.head;
          let itemIndex = 0;

          for (let r = 0; r < L.counts.length; r++) {
            const cCount = L.counts[r];
            const s = L.mode === "square" ? L.s : L.sizes[r];
            // 每行水平居中，保证左右留白对称
            const rowW = cCount * s + (cCount - 1) * gap;
            const x0 = (W - rowW) / 2; // 始终相对画幅水平居中

            for (let c = 0; c < cCount; c++) {
              const cx = x0 + c * (s + gap);
              const cy = y;
              const it = pick[itemIndex];
              const img = imgs[itemIndex];

              if (img) {
                drawCover(x, img, cx, cy, s);
              } else {
                miss++;
                x.fillStyle = theme.emptyCell;
                x.fillRect(cx, cy, s, s);
              }

              if (L.textMode) {
                x.fillStyle = theme.albumTextColor;
                x.font = `500 ${baseFont}px ${SYS_CN}, sans-serif`;
                x.fillText(fit(x, it.name, s), cx, cy + s + baseFont * 1.5);

                x.fillStyle = theme.albumArtistColor;
                x.font = `400 ${baseFont * 0.82}px ${SYS_CN}, sans-serif`;
                x.fillText(fit(x, it.artist, s), cx, cy + s + baseFont * 2.5);
              }
              itemIndex++;
            }
            y += s + cap + gap;
          }

          posterData = { pick, imgs, L, miss };
          hasRendered = true;

          cv.style.display = "block";
          $("dl").style.display = "";
          // iOS Safari 忽略 <a download>，canvas 元素本身也不支持长按保存。
          // 生成后把画布内容镜像成一张真实 <img>：触摸设备上显示它（可长按存入相册），
          // 桌面端保持 canvas + 下载按钮不变。
          syncSaveImg(cv);

          const modeTip = L.mode === "square" ? `方形网格 ${L.side}×${L.side}` : "阶梯排版";
          const themeName =
            themeKey === "light" ? "极简白" : themeKey === "glass" ? "毛玻璃" : "深邃黑";
          if (miss) {
            $("warn").textContent = `完成（${modeTip} · ${themeName}）！但 ${miss} 张封面加载失败（显示为灰块）。`;
          } else if (!isFirstTime) {
            $("warn").textContent = `${modeTip} · ${themeName} · 已实时更新`;
          } else {
            $("warn").textContent = IS_TOUCH
              ? `生成完成（${modeTip}）！长按上方图片即可存入相册。`
              : `生成完成（${modeTip}）！点击下载图片。`;
          }
        } finally {
          hideVeil();
        }
      }

      // ===== 首次生成 =====
      $("gen").onclick = () => renderPoster(true);

      // ===== 即选即看：改下拉框直接重绘（300ms 防抖，无遮罩） =====
      function scheduleRedraw() {
        // 画布还没内容时什么都不做，等用户点「生成图片」
        if (!hasRendered) return;
        clearTimeout(redrawTimer);
        redrawTimer = setTimeout(() => renderPoster(false), 300);
      }
      ["themeSel", "fontSel", "showInfo", "layoutSel"].forEach((id) => {
        const el = $(id);
        if (el) el.addEventListener("change", scheduleRedraw);
      });

      // 触摸设备（手机/平板）才走长按保存路径
      const IS_TOUCH =
        window.matchMedia("(hover: none) and (pointer: coarse)").matches ||
        navigator.maxTouchPoints > 1;

      function syncSaveImg(canvas) {
        const img = $("saveImg");
        const tip = $("saveTip");
        if (!IS_TOUCH || !img || !canvas.width) return;

        // 用 JPEG（0.92）：2400px 海报存成 PNG 有 4-8MB，手机上保存慢、
        // 部分机型直接失败；封面本就是照片，JPEG 观感几乎无差别（约 200KB）。
        // 用 data: URL 而不是 blob: —— iOS Safari 对 blob 图片长按保存
        // 时常给出空白结果，data URL 才是稳的那条路。
        try {
          const url = canvas.toDataURL("image/jpeg", 0.92);
          if (!url || url.length < 1024) return;
          img.src = url;
          img.style.display = "block";
          canvas.style.display = "none";
          if (tip) tip.style.display = "block";
        } catch (e) {
          // 画布被跨域图片污染时会抛错，此时保持 canvas 原样显示
        }
      }

      function clearSaveImg() {
        const img = $("saveImg");
        const tip = $("saveTip");
        if (img) {
          img.removeAttribute("src");
          img.style.display = "none";
        }
        if (tip) tip.style.display = "none";
      }

      $("dl").onclick = () => $("cv").toBlob((b) => {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(b);
          a.download = "my-top-albums.png";
          a.click();
        });

      $("clr").onclick = () => {
        if (confirm("清空列表？")) {
          items = [];
          save();
          render();
          $("cv").style.display = "none";
          $("dl").style.display = "none";
          $("warn").textContent = "";
          clearSaveImg();
        }
      };
    </script>

    <!-- 背景墙动效开关：系统禁用了动效时给出提示并提供一键开启 -->
    <script>
      (function motionSwitch() {
        var KEY = "wallMotionOn";
        var html = document.documentElement;
        var tip = document.getElementById("motionTip");
        if (!tip) return;

        var mq = window.matchMedia("(prefers-reduced-motion: reduce)");

        // 用户此前主动开启过，就保持
        if (localStorage.getItem(KEY) === "1") html.setAttribute("data-motion", "on");

        // 不看媒体查询的「声明」，而是实测动画是否真的在推进 ——
        // 有些环境（节能模式 / 远程桌面 / 无 GPU 合成层）会让动画
        // 声明为 running 却不真正前进，只有采样位置才能发现。
        function sync() {
          var forced = html.getAttribute("data-motion") === "on";
          if (forced) { tip.hidden = true; return; }

          var el = document.querySelector(".wt");
          if (!el) { tip.hidden = true; return; }

          var cs = getComputedStyle(el);
          // 声明层面就被关掉了，不用再采样
          if (cs.animationName === "none" || cs.animationPlayState === "paused") {
            showTip();
            return;
          }

          // 声明是运行中，采样一次确认真的在动
          var a = el.getBoundingClientRect().left;
          setTimeout(function () {
            var b = el.getBoundingClientRect().left;
            // 90s 走完 50% 宽度，400ms 约移动 7-8px；留 0.4px 容差
            if (Math.abs(a - b) > 0.4) discardTip();
            else showTip();
          }, 400);
        }

        // 提示条只在页面顶部露出，滚下去就收起 —— 避免挡住网格与按钮
        function placeTip() {
          if (tip.hidden) return;
          tip.classList.toggle("dim", window.scrollY > 160);
        }
        function showTip() {
          tip.hidden = false;
          placeTip();
        }
        function discardTip() {
          tip.hidden = true;
        }
        window.addEventListener("scroll", placeTip, { passive: true });

        tip.addEventListener("click", function () {
          html.setAttribute("data-motion", "on");
          localStorage.setItem(KEY, "1");
          document.querySelectorAll(".wt").forEach(function (el) {
            el.style.animationPlayState = "running";
          });
          sync();
        });

        if (mq.addEventListener) mq.addEventListener("change", sync);
        else if (mq.addListener) mq.addListener(sync);

        // 等封面渲染完再判断一次，避免在骨架阶段误判
        window.addEventListener("load", function () {
          sync();
          setTimeout(sync, 600);
        });
        sync();
      })();
    </script>
  </body>
</html>
