              const albumGroups = await hunt("search?entity=album&limit=25");
              cards = normAlbums(merge(albumGroups, (r) => r.collectionId));
              if (cards.length) head = "「" + q + "」的搜索结果　" + cards.length + " 张";
            }
          }

          if (!cards.length) {
            $("msg").textContent = trackMode
              ? "没搜到单曲。试试只输入歌手名（能列出他的全部曲目），或缩短歌名。"
              : "没搜到。试试只输入歌手名，或缩短关键词。";
            return;
          }

          // 结果存进缓存，下次同关键词直接复用
          search._cache.set(cacheKey, { cards, head, regions: REGIONS.length });
          paintCards(cards, head, REGIONS.length);
        } catch (e) {
          $("msg").textContent = "搜索失败（" + (e.message || e) + "）。稍等一下再试 —— iTunes 有频率限制，连搜太多次会被临时拦。";
        }
      }

      /**
       * 渲染搜索结果卡片。抽成独立函数是因为「命中缓存」和「新搜索」
       * 两条路径都要用它，否则会写成两份几乎相同的 DOM 代码。
       */
      function paintCards(cards, head, regionCount) {
        const trackMode = isTrackMode;
        $("msg").textContent =
          head + (regionCount > 1 ? "（已合并多地区曲库）" : "");
        $("res").innerHTML = "";

        cards.forEach((c) => {
          const b = document.createElement("button");
          b.className = "c";
          b.innerHTML = '<img loading="lazy" alt=""><div><b></b><span></span></div>';
          b.querySelector("img").src = c.thumb;
          b.querySelector("b").textContent = c.name;
          // 单曲卡片：第二行显示「歌手 · 所属专辑」，
          // 这样用户能分清同名歌曲的不同版本（原版 / 精选集 / 现场）
          b.querySelector("span").textContent = trackMode
            ? c.artist + (c.album ? " · " + c.album : "")
            : c.artist + (c.date ? "　" + c.date : "");
          b.title = c.name + (c.artist ? " - " + c.artist : "") + (c.album ? "\n" + c.album : "");
          b.onclick = () => {
            b.classList.remove("pulse");
            void b.offsetWidth;
            b.classList.add("pulse");
            b.addEventListener("animationend", () => b.classList.remove("pulse"), { once: true });
            // 导出歌单要用的字段必须一起带过去，否则 add() 之后
            // amUrl / dur 就丢了，导出的 m3u 里没有 Apple Music 链接
            add({
              name: c.name,
              artist: c.artist,
              src: c.src,
              kind: c.kind,
              album: c.album,
              amUrl: c.amUrl || "",
              dur: c.dur || 0,
            });
          };
          $("res").appendChild(b);
        });
      }

      $("go").onclick = search;
      $("q").onkeydown = (e) => {
        if (e.key === "Enter") search();
      };

      $("madd").onclick = () => {
        const f = $("f").files[0], n = $("mn").value.trim(), a = $("ma").value.trim();
        if (!f || !n) {
          $("msg").textContent = "请选择图片并填写专辑名。";
          return;
        }
        fileToSquare(f, (dataUrl) => {
          if (!dataUrl) {
            $("msg").textContent = "图片读取失败，请换一张。";
            return;
          }
          add({ name: n, artist: a, src: dataUrl });
          $("mn").value = "";
          $("ma").value = "";
          $("f").value = "";
        });
      };

      // 替换用：上传图片替换选中的格子
      $("rf").onchange = () => {
        const f = $("rf").files[0];
        const idx = replaceTarget;
        if (!f || idx < 0) return;
        fileToSquare(f, (dataUrl) => {
          if (!dataUrl) {
            toast("图片读取失败", "!");
            return;
          }
          if (items[idx]) {
            items[idx].src = dataUrl;
            save();
            render();
            toast(`已替换第 ${idx + 1} 名的封面`, "↻");
          } else {
            // 目标槽已空：当作新增填入该名次
            const keep = selectedSlot;
            selectedSlot = idx;
            add({ name: "自选封面", artist: "", src: dataUrl });
            selectedSlot = keep;
          }
          clearSelection();
          render();
        });
      };

      // 点击空白处关闭菜单 / 取消选择 / 退出抓取
      document.addEventListener("click", (e) => {
        const p = $("pop");
        if (!p.hidden && !p.contains(e.target) && !e.target.closest(".s")) closePop();
        if (!e.target.closest(".s") && !e.target.closest(".pop") && dragFrom >= 0) {
          dropGrab();
          render({ keepScroll: true });
          toast("已取消移动", "·");
        }
      });
      // Esc 退出抓取 / 关闭菜单
      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        if (!$("pop").hidden) { closePop(); return; }
        if (dragFrom >= 0) {
          dropGrab();
          render({ keepScroll: true });
          toast("已取消移动", "·");
        }
      });
      window.addEventListener("scroll", () => {
        if (!$("pop").hidden) closePop();
      });

      // ===== 背景墙随滚动逐层压暗（纯视觉，不改任何业务逻辑） =====
      (function initVeil() {
        const veil = $("veil");
        if (!veil) return;
        let raf = 0;
        const apply = () => {
          raf = 0;
          // 滚动 120px 起步，到 460px 完全遮住背景墙
          const y = window.scrollY || window.pageYOffset || 0;
          const t = Math.max(0, Math.min(1, (y - 120) / 340));
          veil.style.opacity = String(t * 0.96);
        };
        window.addEventListener(
          "scroll",
          () => {
            if (!raf) raf = requestAnimationFrame(apply);
          },
          { passive: true }
        );
        apply();
      })();

      function fit(x, t, w) {
        if (x.measureText(t).width <= w) return t;
        while (t.length > 1 && x.measureText(t + "…").width > w) t = t.slice(0, -1);
        return t + "…";
      }

      /**
       * 把标题折成不超过 maxLines 行。
       * 拉丁文按空格断词（不切断单词），中文按字断行。
       * 只做折行、不做缩字 —— 缩字会让大标题失去气势，
       * 而纸内还空着一块本该给字的区域。
       * 返回行数组；若折到 maxLines 仍装不下，返回的行会超宽，
       * 由调用方决定是否退化成缩字号。
       */
      function wrapTitle(x, text, maxW, maxLines) {
        const tokens = text.includes(" ")
          ? text.split(/(\s+)/).filter((s) => s && s.trim())
          : Array.from(text);

        const lines = [];
        let cur = "";
        for (const tk of tokens) {
          const test = cur ? cur + (text.includes(" ") ? " " : "") + tk : tk;
          if (x.measureText(test).width <= maxW) {
            cur = test;
            continue;
          }
          if (cur) {
            lines.push(cur);
            cur = "";
            if (lines.length >= maxLines) return lines;
          }
          // 单个 token 自己就超宽：按字符硬切
          if (x.measureText(tk).width > maxW) {
            let piece = "";
            for (const ch of Array.from(tk)) {
              if (x.measureText(piece + ch).width <= maxW) {
                piece += ch;
              } else {
                if (piece) lines.push(piece);
                piece = ch;
                if (lines.length >= maxLines) return lines;
              }
            }
            cur = piece;
          } else {
            cur = tk;
          }
        }
        if (cur) lines.push(cur);
        return lines.length ? lines : [text];
      }

      // 量标题用的一次性画布：建一次复用，避免每帧 new 一个 canvas
      const measureCtx = (() => {
        const c = document.createElement("canvas");
        c.width = c.height = 8;
        return c.getContext("2d");
      })();

      /**
       * 布局阶段预判诗页标题会折成几行、最终用多大字号。
       * 与绘制端共用 wrapTitle，保证「布局预留的高度」和「真正画出来的」
       * 完全一致 —— 这两处一旦各算一套，长标题折行就会压住封面。
       * 返回 { lines, size }，lines 是行数（1 或 2）。
       */
      function measurePoemTitle(text, drawF, maxW, fontKey) {
        const fd = fonts[fontKey] || fonts.system;
        const capped = isCapsFont(fontKey) ? (text || "").toUpperCase() : text || "";
        measureCtx.font = `${fd.weight} ${drawF}px ${fd.stack}`;
        let lines = wrapTitle(measureCtx, capped, maxW, 2);
        if (lines.every((ln) => measureCtx.measureText(ln).width <= maxW)) {
          return { lines: lines.length, size: drawF };
        }
        // 两行也装不下 → 绘制端会退回缩字号；布局按 1 行预留即可
        return { lines: 1, size: drawF };
      }

      // ===== 图片内存缓存 =====
      // 即选即看的核心：改主题/字体时不重新下载封面，直接从 Map 里取。
      // 值为 Promise（而不是已完成的 Image），这样并发请求同一张图只会发一次。
      const imageCache = new Map();

      // 只有全大写的拉丁展示字体才转大写；中文标题转了没意义。
      // 布局量行数与绘制取字号都要用它，必须只有一份定义。
      function isCapsFont(fontKey) {
        return (
          fontKey === "bebas" ||
          fontKey === "boldonse" ||
          fontKey === "montserrat" ||
          fontKey === "anton"
        );
      }

      function load(src) {
        if (!src) return Promise.resolve(null);
        const hit = imageCache.get(src);
        if (hit) return hit;

        const p = new Promise(async (resolve) => {
          const timer = setTimeout(() => resolve(null), 6000);
          try {
            const b = src.startsWith("data:")
              ? await (await fetch(src)).blob()
              : await (await fetch(src, { mode: "cors" })).blob();
            const img = await createImageBitmap(b);
            clearTimeout(timer);
            resolve(img);
          } catch (e) {
            const im = new Image();
            im.crossOrigin = "anonymous";
            im.onload = () => { clearTimeout(timer); resolve(im); };
            im.onerror = () => { clearTimeout(timer); resolve(null); };
            im.src = src;
          }
        });
        imageCache.set(src, p);
        // 加载失败的结果不留缓存，下次重绘还有机会重试
        p.then((v) => { if (!v) imageCache.delete(src); });
        return p;
      }

      // ===== 排版引擎 =====
      // 目标：阶梯式（前排大、后排小）、严格递增、总数守恒、无空洞
      const LAY = { W: 2400, pad: 100, gap: 8, head: 280 };
      LAY.cw = LAY.W - LAY.pad * 2;
      const cellSize = (cols) => (LAY.cw - (cols - 1) * LAY.gap) / cols;
      const strictInc = (a) => a.every((v, i) => i === 0 || v > a[i - 1]);

      // 等比裁切绘制：保持 1:1 正方形且不变形（居中 cover）
      function drawCover(ctx, img, dx, dy, size) {
        const iw = img.width || img.naturalWidth;
        const ih = img.height || img.naturalHeight;
        if (!iw || !ih) {
          ctx.fillStyle = "#333";
          ctx.fillRect(dx, dy, size, size);
          return;
        }
        const scale = Math.max(size / iw, size / ih);
        const sw = size / scale;
        const sh = size / scale;
        const sx = (iw - sw) / 2;
        const sy = (ih - sh) / 2;
        ctx.drawImage(img, sx, sy, sw, sh, dx, dy, size, size);
      }

      // 给定 行数R / 总数N / 相邻行缩放比k，生成严格递增且和为N的行数数组
      function geomRows(R, N, k) {
        let lo = 0.1, hi = N / R, C = 0;
        for (let t = 0; t < 60; t++) {
          C = (lo + hi) / 2;
          let s = 0;
          for (let i = 0; i < R; i++) s += Math.max(1, Math.round(C * Math.pow(k, i)));
          if (s < N) lo = C; else hi = C;
        }
        for (const C0 of [C, (lo + hi) / 2, lo, hi]) {
          const c = [];
          for (let i = 0; i < R; i++) c.push(Math.max(1, Math.round(C0 * Math.pow(k, i))));
          let d = N - c.reduce((a, b) => a + b, 0), guard = 0;
          while (d > 0 && guard++ < 4000) {
            for (let j = R - 1; j >= 0 && d > 0; j--) {
              const cap = j === R - 1 ? Infinity : c[j + 1] - 1;
              if (c[j] + 1 <= cap) { c[j]++; d--; }
            }
          }
          while (d < 0 && guard++ < 8000) {
            for (let j = 0; j < R && d < 0; j++) {
              const floor = j === 0 ? 1 : c[j - 1] + 1;
              if (c[j] - 1 >= floor) { c[j]--; d++; }
            }
          }
          if (d === 0 && strictInc(c)) return c;
        }
        return null;
      }

      function layoutCost(c, N) {
        const R = c.length;
        const sz = c.map(cellSize);
        const s0 = sz[0], s1 = sz[R - 1];
        const ratio = s0 / s1;
        let dev = 0;
        for (let i = 1; i < R; i++) dev += Math.abs(Math.log(sz[i - 1] / sz[i]));
        dev = R > 1 ? dev / (R - 1) : 0;
        let varz = 0;
        if (R > 2) {
          const rs = [];
          for (let i = 1; i < R; i++) rs.push(Math.log(sz[i - 1] / sz[i]));
          const m = rs.reduce((a, b) => a + b, 0) / rs.length;
          varz = Math.sqrt(rs.reduce((a, b) => a + (b - m) ** 2, 0) / rs.length);
        }
        let k = 0;
        k += Math.abs(ratio - 2.25) * 4.0;              // 阶梯总陡度
        k += Math.max(0, ratio - 3.4) * 7;              // 太陡
        k += Math.max(0, 1.75 - ratio) * 12;            // 太平
        k += varz * 6;                                  // 台阶不均匀
        k += Math.max(0, dev - 0.3) * 10;               // 单级跳变过大
        k += Math.max(0, 2 - c[0]) * (N >= 3 ? 9 : 0);  // 首行至少 2 个（否则一张占满整宽，画幅被拉成超长竖条）
        k += Math.max(0, c[0] - 10) * 1.2;              // 首行别太多
        k += s0 > 1000 ? (s0 - 1000) / 150 : 0;         // 首图别过大
        k += s1 < 200 ? (200 - s1) / 40 : 0;            // 尾图别过小
        const idealR = Math.max(2, Math.round(Math.sqrt(N) / 1.7));
        k += Math.abs(R - idealR) * 1.6;

        // 画幅比例约束：每行都铺满画布宽度，行数少时整幅会变成超宽横条。
        // 让成品尽量落在 3:2 ~ 4:5 的舒服区间，避免 N 相邻却一个偏方一个偏条。
        const H = LAY.head + LAY.pad + sz.reduce((a, h) => a + h + LAY.gap, -LAY.gap);
        const shape = H / LAY.W;               // 高/宽
        k += Math.max(0, 0.62 - shape) * 26;   // 太扁（横条）
        k += Math.max(0, shape - 1.15) * 14;   // 太高（竖条）
        return k;
      }

      // 返回每一行的列数数组，sum === N
      function planRows(N) {
        if (N <= 0) return [];
        let best = null;
        for (let R = 1; R <= Math.min(N, 8); R++) {
          for (const k of [1.05, 1.09, 1.13, 1.17, 1.21, 1.26, 1.32, 1.4, 1.5]) {
            const c = geomRows(R, N, k);
            if (!c || c.length !== R) continue;
            const sc = layoutCost(c, N);
            if (!best || sc < best.sc) best = { c, sc };
          }
        }
        return best ? best.c : [N];
      }

      // 全局缓存，避免重复寻优
      const planCache = new Map();
      const plan = (N) => {
        if (!planCache.has(N)) planCache.set(N, planRows(N));
        return planCache.get(N);
      };

      // ===== 正方形网格：N 为完全平方数时，排成 √N × √N =====
      // 用函数声明（会被提升）：render() 在模块初始化早期就可能被调用
      function isPerfectSquare(n) {
        if (n < 1) return false;
        const r = Math.round(Math.sqrt(n));
        return r * r === n;
      }

      // 返回 { mode, counts, head, gap, pad, W, H }
      // mode = "square"：等大方块网格，画幅为正方形；mode = "stair"：阶梯
      //
      // titleSize：'std' | 'big' | 'xl'，只影响「顶部抬头高度」与「画布总高度」。
      // 关键约束：格子尺寸 s、列数 counts 的求解过程一字未改 —— 大字标题
      // 只把画布往下拉长、网格整体下移，绝不缩放封面，也不改每行列数。
      //
      // 字号增量统一按 (F - 80) * 1.8 算，正好等价于「head = pad + F * 1.8 + 36」，
      // 且 F = 80 时增量归零，标准档与原版逐像素一致。
      // 两个分支的基准差 80：方格分支的 padY 里已经含了 pad，抬头只需 200；
      // 阶梯分支的 head 要自己带上 pad，所以是 280。
      function buildLayout(N, textMode, layoutPref, titleSize, titleText, fontKey) {
        const F = titleFontSizeOf(titleSize);
        const grow = (F - TITLE_SIZES.std) * 1.8; // 标准档为 0
        const autoSquare = isPerfectSquare(N);
        const useSquare =
          layoutPref === "square" ? true : layoutPref === "stair" ? false : autoSquare;

        // ===== 诗页堆叠版式 =====
        // 结构取自 TTPD 封面：两张等大的「纸页」叠在一起，只露一条极细的边。
        // 关键约束与方形网格完全一致：**格子尺寸 s 的求解公式一个字都不改**，
        // 画布只在四边加宽。所以这里先按方格原公式解出 s，再把纸张往外扩。
        if (layoutPref === "poem") {
          const side = Math.max(1, Math.round(Math.sqrt(N)));
          const gap = 8;
          const textModeOn = !!textMode;
          const L0 = 2400;          // 求解基准（与方格分支同一个数，保证 s 不变）
          const TB = 200;
          const PREF = 110;
          const gridTarget = L0 - PREF * 2 - TB;   // ← 原公式，不动

          const fontOf = (s) => Math.max(11, Math.min(26, s * 0.075));
          const rowHOf = (s) => s + (textModeOn ? fontOf(s) * 2.6 : 0);
          const gridHOf = (s) => side * rowHOf(s) + (side - 1) * gap;
          let lo = 20, hi = L0, s = 100;
          for (let t = 0; t < 90; t++) {
            s = (lo + hi) / 2;
            if (gridHOf(s) < gridTarget) lo = s; else hi = s;
          }
          s = lo;

          const f = fontOf(s);
          const gridW = side * s + (side - 1) * gap;
          const gridH = gridHOf(s);

          // 纸张内边距：从封面/标题到纸边的距离。
          // TTPD 实测：帧在 194→1306，照片在 280→1220，即照片占帧宽 84.5%。
          // 我们反过来解：格子 654.67 要占纸宽 84.5%，内边距就得取 0.28 格。
          // 取 0.15 会让封面占掉纸宽 91%，纸边几乎看不见，又回到"排太满"。
          const paperPad = Math.round(s * 0.28);
          // 诗页版式里标题是唯一的大字，且要有 TTPD 那种压场感，
          // 所以它有一套自己的三档字号，不复用全局的 80/100/120。
          // 标准档 = 186px：这是「方案二」的观感（原 120 × 1.55），
          // 比原来诗页的标准档（80 × 1.55 = 124）明显更重。
          const POEM_TITLE_SIZES = { std: 186, big: 210, xl: 234 };
          const drawF = POEM_TITLE_SIZES[titleSize] || POEM_TITLE_SIZES.std;
          const sigSize = Math.round(drawF * 0.34);    // 落款字号

          // 标题块总高 = 内边距 + 标题(含上行留白) + 标题到网格的间距。
          // 折成几行必须在这里量准 —— 布局和绘制如果用两套算法，
          // 长标题折行后就会压到第一排封面上（或者单行时白空一大块）。
          const pw0 = gridW + paperPad * 2;
          const maxTitleW = pw0 - paperPad * 2;
          const measured = measurePoemTitle(titleText, drawF, maxTitleW, fontKey);
          const lineCount = measured.lines;
          const poemTitleH = drawF * (1 + (lineCount - 1) * 1.06);
          const titleTopGap = Math.round(drawF * 0.30);   // 纸顶到标题顶
          const titleToGrid = Math.round(drawF * 0.42);   // 标题末行底到封面顶
          const paperTop = paperPad + titleTopGap + poemTitleH + titleToGrid;
          // 标题基线：纸内边距 + 上方留白 + 约 0.78 个字号（大写字母视觉中心）
          const titleBase = paperPad + titleTopGap + Math.round(drawF * 0.78);
          // 纸底内边距：文字模式下最后一行专辑名/歌手会画在格子之下，
          // 那部分高度已经算进 gridH 里了，所以纸底只需留常规内边距。
          const paperPadBottom = paperPad;

          const pw = gridW + paperPad * 2;
          const ph = paperTop + gridH + paperPadBottom;

          // 两页的错位量：草图为宽 12.5% / 高 9%，TTPD 更小。取中间克制值。
          const offX = Math.round(pw * 0.055);
          const offY = Math.round(ph * 0.050);

          // 画布 = 两页的并集 + 外边距。
          // 后页朝左上偏，前页朝右下，故总宽 = pw + offX，总高 = ph + offY。
          // 底部要额外留出「落款」的位置：它是纸外的东西，不能挤在纸内。
          const outerPad = Math.round(s * 0.16);
          // 落款区：基线上下各留一倍字高，字才不会贴住纸底和画布底
          const sigZone = Math.round(sigSize * 4.2);
          const bottomPad = Math.max(outerPad, sigZone);
          const W = pw + offX + outerPad * 2;
          // 诗页版式不需要 grow：标题块高度已随 F 等比变化，
          // 再叠 grow 会让网格顶出纸页下边界。
          const H = ph + offY + outerPad + bottomPad;

          // 前页（主体）左上角
          const frontX = outerPad + offX;
          const frontY = outerPad + offY;

          return {
            mode: "poem",
            side,
            counts: new Array(side).fill(side),
            s,
            gap,
            pad: outerPad,
            padY: outerPad,
            // 标题左对齐到「纸内边距」，而不是纸框本身 —— 否则字会压线
            contentLeft: frontX + paperPad,
            W,
            H,
            head: frontY + paperTop,
            baseFont: f,
            cap: textModeOn ? f * 2.6 : 0,
            textMode: textModeOn,
            titleFontSize: F,
            // 诗页版式的标题实际绘制字号（三档自有字号表），由布局统一给出，
            // 绘制端直接取用 —— 两处各算一遍一定会漂移
            drawTitleSize: drawF,
            // 标题会折成几行，同样由布局量好交给绘制端
            titleLines: lineCount,
            // 标题压在纸内左上角（不是网格上方）—— 这是诗页版式的识别点
            titleY: frontY + titleBase,
            subY: frontY + titleBase + Math.round(F * 0.72),
            poem: {
              paperPad, paperTop, paperPadBottom,
              pw, ph, offX, offY, outerPad, bottomPad, sigSize,
              frontX, frontY,
              backX: frontX - offX,
              backY: frontY - offY,
              titleX: frontX + paperPad,
              // 落款基线：距纸底约 1.1 字高，下方再留约 1.6 字高
              sigY: frontY + ph + Math.round(sigSize * 1.15),
            },
          };
        }

        if (useSquare) {
          const side = Math.round(Math.sqrt(N));
          const gap = 8;
          const textModeOn = !!textMode;
          const L = 2400; // 目标正方形边长

          // 结构的核心：标题块紧贴网格上方（不随格子尺寸变化），
          // 剩余空间平均分给上下留白 —— 这样无论 N 多大，视觉重心都是居中的。
          const TB = 200;   // 标题区总高：题名 + 副题 + 到网格的间距
          const PREF = 110; // 参考上下留白
          // 网格目标高度：只减去固定的 TB，不受 titleSize 影响。
          // 这是「不改图片大小」的关键：格子尺寸永远按原来的公式求解，
          // 标题变大只会让画布变高，不会挤压网格。
          const gridTarget = L - PREF * 2 - TB;

          const fontOf = (s) => Math.max(11, Math.min(26, s * 0.075));
          const rowHOf = (s) => s + (textModeOn ? fontOf(s) * 2.6 : 0);
          const gridHOf = (s) => side * rowHOf(s) + (side - 1) * gap;

          // 二分求 s，使网格高度恰好为 gridTarget（随 s 单调递增）
          let lo = 20, hi = L, s = 100;
          for (let t = 0; t < 90; t++) {
            s = (lo + hi) / 2;
            if (gridHOf(s) < gridTarget) lo = s; else hi = s;
          }
          s = lo; // 保守取小者，保证不超高

          const f = fontOf(s);
          const rowH = rowHOf(s);
          const gridW = side * s + (side - 1) * gap;
          const gridH = gridHOf(s);

          // padY 完全沿用原公式，上下留白依旧对称。
          // 标题变大只做两件事：画布加高 grow、网格整体下移 grow。
          const padY = (L - TB - gridH) / 2;
          // 横向：格子为正方形，多余宽度作为左右边距
          const padX = (L - gridW) / 2;
          const H = L + grow;

          return {
            mode: "square",
            side,
            counts: new Array(side).fill(side),
            s,
            gap,
            pad: padX,
            padY,
            contentLeft: padX,
            W: L,
            H,
            head: padY + TB + grow,
            baseFont: f,
            cap: textModeOn ? f * 2.6 : 0,
            textMode: textModeOn,
            titleFontSize: F,
            // 78 / 144 是 80px 时的原值；按字号等比放大，标准档分毫不差
            titleY: padY + Math.round(F * 0.975),
            subY: padY + Math.round(F * 0.975) + Math.round(F * 0.825),
          };
        }
        // 阶梯
        const counts = plan(N);
        const rowHeights = counts.map(cellSize);
        const textModeOn = !!textMode;
        const minCell = Math.min(...rowHeights);
        const baseFont = Math.max(11, Math.min(26, minCell * 0.075));
        const cap = textModeOn ? baseFont * 2.6 : 0;
        // 网格总高完全按原公式算（只取决于行高与 gap），
        // 标题变大只加在顶部 head 上，画布随之变高。
        const head = LAY.head + grow;
        let H = head + LAY.pad;
        rowHeights.forEach((h) => (H += h + cap + LAY.gap));
        H -= LAY.gap;
        return {
          mode: "stair",
          counts,
          sizes: rowHeights,
          gap: LAY.gap,
          pad: LAY.pad,
          padY: LAY.pad,
          W: LAY.W,
          H: Math.round(H),
          head,
          titleFontSize: F,
          // 60 / 120 是 80px 时的原值
          titleY: LAY.pad + Math.round(F * 0.75),
          subY: LAY.pad + Math.round(F * 1.5),
          baseFont,
          cap,
          textMode: textModeOn,
        };
      }

      // ===== 单曲版式（Track Mode）=====
      // 两套版式，按数量自动切换：
      //   N <= 9  → "track9"  九宫格数字叠加（3×3）
      //   N >= 10 → "tracklist" 列表串烧（竖长条）
      //
      // 为什么不复用专辑版式：单曲的封面来自它所属的专辑，
      // 9 首里往往只有 3~4 张不同的图（实测 Taylor Swift 200 首歌
      // 落在 62 张专辑上）。做成封面墙会满屏重复图案，
      // 所以视觉主角必须换成「排名数字 + 曲名」。
      //
      // 独立于 buildLayout 的理由：专辑版式的三个分支
      // （square / stair / poem）都有逐像素回归断言锁着，
      // 把单曲塞进去必然要动那些公式。新开一个函数，专辑版式
      // 一行都不用改 —— 这是"不破坏现有功能"最省事的做法。
      const TRACK_FONT = `Helvetica, Arial, sans-serif`;

      // 数字叠加版的主画布基准。取 2400 是因为专辑版式也是 2400，
      // 用户连续生成两种海报时尺寸观感一致。
      function buildTrackLayout(N, titles, opts) {
        const o = opts || {};
        const W0 = 2400;
        const PAD = 100;

        if (N <= 9) {
          // ---------- 九宫格数字叠加 ----------
          // 实测参考图（1024×1024）：
          //   标题字高 101 / 1024 = 9.9%
          //   封面三列，列间距约 24px（2.3%）
          //   白色标签条厚约 42px（4.1%），压在封面下沿之上
          // 列数选择：目标是「尽量接近正方形，且最后一行不要只剩一个」。
          // 直接 Math.round(sqrt(N)) 会在 N=3 时得 2 列（2+1，末行孤零零一个），
          // 而 3 列 + 1 行显然更整齐。所以遍历候选列数，用罚分挑最好的。
          const gap = 40;
          const contentW = W0 - PAD * 2;
          let cols = 1;
          {
            let best = Infinity;
            for (let c = 1; c <= Math.min(3, N); c++) {
              const r = Math.ceil(N / c);
              if (r > 3) continue; // 九宫格版式最多 3 行
              const lastRow = N - (r - 1) * c;
              let score = Math.abs(c - r) * 2;      // 越方越好
              score += Math.abs(c - 3) * 0.6;       // 整体偏三列更好看
              if (lastRow === 1 && r > 1) score += 6; // 末行只剩一个，重罚
              if (score < best) { best = score; cols = c; }
            }
          }
          const rows = Math.ceil(N / cols);
          const s = (contentW - (cols - 1) * gap) / cols;

          // 标题区高度：标题 + 副标题（PLAYLIST 那行）
          const titleH = Math.round(s * 0.42);
          const subH = Math.round(s * 0.17);
          const headGap = Math.round(s * 0.16);

          // 每行总高 = 封面 + 标签条 + 歌手行 + 行间距
          const labelH = Math.round(s * 0.175);
          const artistH = Math.round(s * 0.15);
          const rowGap = Math.round(s * 0.13);
          const rowH = s + labelH + artistH + rowGap;

          const gridH = rows * rowH - rowGap;
          const head = PAD + titleH + subH + headGap;
          const H = head + gridH + PAD;

          // 每行实际格子数：前面各行填满，余数放末行。
          // 不能 new Array(rows).fill(cols) —— 那会造出比 N 更多的格子，
          // 绘制循环去取不存在的数据，索引错位后出现空标签。
          // 也不能平均分（N=5、2列时变成 [2,2] 丢掉一个），必须让总和恰好等于 N。
          const counts = [];
          let left = N;
          for (let r = 0; r < rows; r++) {
            const take = Math.min(cols, left);
            counts.push(take);
            left -= take;
          }
          // 末行不足时，把它居中：视觉上比左对齐更稳
          const lastCount = counts[counts.length - 1];

          return {
            mode: "track9",
            W: W0,
            H: Math.round(H),
            side: cols,
            rows,
            counts,
            lastCount,
            s,
            gap,
            pad: PAD,
            head,
            // 标题：占据整个内容宽度，左上对齐
            titleX: PAD,
            titleY: PAD + Math.round(titleH * 0.78),
            titleSize: Math.round(titleH * 0.92),
            subX: PAD,
            subY: PAD + titleH + Math.round(subH * 0.82),
            subSize: Math.round(subH * 0.95),
            labelH,
            artistH,
            rowGap,
            rowH,
            // 数字叠加：字号取封面边长的 0.78，压在右下角。
            // 参考图里数字高度接近封面的一半以上，是视觉主角之一，
            // 0.62 会显得偏小、像角标。
            numSize: Math.round(s * 0.78),
          };
        }

        // ---------- 列表串烧 ----------
        // 两张参考图的像素实测（比例都按画布**宽度**归一，与画布高度无关）：
        //
        //                     图一(1600×1740)   图二(896×1200)   目标
        //   封面宽            6.31%             9.60%            9.60%
        //   行距              9.16%            10.44%           10.42%
        //   封面 / 行距       69%               92%              92%
        //   曲名字高          2.44%             3.79%            3.75%
        //   歌手字高          1.56%             2.57%            2.50%
        //   数字高            —                 6.14%            6.00%
        //   分隔线左起        4.2%              5.3%             4.17%
        //
        // 图一是我们先前的参数（封面 150 / 行距 220），问题很清楚：
        //   封面只占行高 69%（上下各留 15% 空白），字号也小，
        //   曲名一行最长只到画布 46% —— 右边一半全是空的。
        // 图二反过来：封面几乎顶满行高（92%），字号同步放大，
        // 于是文字自然写到 49% 宽，看起来"右边界"才成立。
        //
        // 换算到 2400 宽：
        //   封面 9.60% × 2400 = 230
        //   行距 10.42% × 2400 = 250   → 封面 230 / 250 = 92% ✓
        //   曲名 3.75% × 2400 = 90     → 是行距的 0.36
        //   歌手 2.50% × 2400 = 60     → 是行距的 0.24
        //   数字 6.00% × 2400 = 144    → 是封面的 0.63
        const rowPitch = 250;
        const thumb = 230;
        const textGap = 44;            // 缩略图与曲名之间
        const contentW = W0 - PAD * 2;

        // 数字列宽必须按「最大编号的位数」实测算出来。
        // 固定值在两位数是会撞：'10' 两个字在 172px 字号下宽约 190px，
        // 直接压到缩略图上（第一版就是这么错的，10/11/12 全部重叠）。
        // 用同款 bold Helvetica 量一次最宽组合，转成比例再乘字号。
        const digits = String(N).length;
        const numRatio = (() => {
          const mc = document.createElement("canvas").getContext("2d");
          mc.font = `900 200px ${TRACK_FONT}`;
          let w = 0;
          // 逐个数字量，取最宽的单字，再乘以位数（等宽假设，留 6% 余量）
          for (let d = 0; d < 10; d++) w = Math.max(w, mc.measureText(String(d)).width);
          return (w / 200) * digits * 1.06;
        })();
        // 数字高取封面的 0.63（图二实测 55/86 ≈ 0.64）。
        // 先前是 1.15 倍封面 —— 那让数字比封面还高，撑破了行的节奏。
        const numSize = Math.round(thumb * 0.63 / 0.72);
        const numW = Math.max(Math.round(thumb * 0.62), Math.round(numSize * numRatio));
        // 数字与封面之间的呼吸：图二实测 86→137 中间有 43px 空白（封面宽的 0.5），
        // 但那是数字右边缘到封面的距离，右对齐后实际间隙就是 numGap。
        const numGap = Math.round(thumb * 0.19);

        // 大标题：图二实测 cap 高 54/896 = 6.03% → 2400 宽下需 cap 高 145，
        // 对应字号 145 / 0.72 ≈ 201。先前取 145 是直接把 cap 高当字号了，
        // 结果标题只有曲名的 1.15 倍，压不住版面。
        const titleSize = 200;
        const titleTop = PAD;
        const titleBottom = titleTop + Math.round(titleSize * 1.05);
        // 标题与列表之间的呼吸：图二实测标题 cap 底 y=119、第 1 行封面顶 y=188，
        // 间隔 69px = 画布宽的 7.7% → 2400 宽下 185。
        // 先前取 78 太紧了，标题几乎贴着第一行。
        const listTop = titleBottom + 110;

        const listH = N * rowPitch;
        const H = listTop + listH + PAD;

        // 分隔线：贯穿内容宽（图二 5.3%~94.6%，两侧各留 5% 内边距）
        const lineW = Math.round(contentW * 0.99);

        return {
          mode: "tracklist",
          W: W0,
          H: Math.round(H),
          N,
          pad: PAD,
          rowPitch,
          thumb,
          numW,
          numX: PAD,
          // 缩略图紧跟数字列右边缘，间距固定 —— 数字右对齐后
          // 这一列才是齐平的，不会因位数变化而忽宽忽窄
          thumbX: PAD + numW + numGap,
          textX: PAD + numW + numGap + thumb + textGap,
          textRight: PAD + contentW,
          // 数字字号：图二实测数字高 55px / 封面 86px = 0.64。
          // Helvetica 数字的 cap height 约占字号 0.72，所以
          // 「视觉高 0.64 × 封面」对应的字号是 0.64 / 0.72 × 封面。
          numSize,
          // 曲名字号：图二曲名视觉高 34px，Helvetica cap 0.72 → 字号 47
          // 换算到 2400 宽：34/896 × 2400 / 0.72 = 126
          titleSize: 126,
          // 歌手字高 23px → 23/896 × 2400 / 0.72 = 86，但小字视觉上要略收，
          // 取 78 才不会和曲名抢
          artistSize: 78,
          // 曲名与歌手名的基线间距（图二 232→263 = 31px → 2400 宽下 83）
          artistGap: 84,
          head: listTop,
          lineX0: PAD,
          lineX1: PAD + lineW,
          // 大标题
          bigTitleX: PAD,
          bigTitleY: titleTop + Math.round(titleSize * 0.86),
          bigTitleSize: titleSize,
          bigTitleW: contentW,
        };
      }

      // ===== 背景主题 =====
      // 每个主题给出一整套配色，白底时专辑文字/作者必须自动转深色，
      // 否则会糊成一片看不见。draw 是"额外的背景绘制"钩子（毛玻璃用）。
      const themes = {
        dark: {
          bg: "#111111",
          titleColor: "#ffffff",
          authorColor: "#aaaaaa",
          albumTextColor: "#e0e0e0",
          albumArtistColor: "#888888",
          emptyCell: "#2a2a2d",
          // 诗页版式：深色底上纸页要比底稍亮一点点才看得出"纸"，
          // 但绝不能白，否则立刻变成"白色卡片"而不是"叠着的诗页"
          paperFill: "#171716",
          paperLine: "rgba(232,226,214,0.40)",
        },
        light: {
          bg: "#f5f5f5",
          titleColor: "#111111",
          authorColor: "#6b6b6b",
          albumTextColor: "#1a1a1a",
          albumArtistColor: "#7a7a7a",
          emptyCell: "#dcdcdc",
          // 极简白底上纸页必须比底更白，否则"两张纸"完全看不出来。
          // 单靠填充不够（白对白没对比），线框要加重到 0.34 才立得住。
          paperFill: "#ffffff",
          paperLine: "rgba(20,20,20,0.34)",
        },
        // 米色信笺：纯米黄底 + 两张干净纸页，不再使用任何背景照片。
        // 命名从「复古乐谱」改来 —— 乐谱图已彻底移除，现在的质感
        // 完全由代码画出来（底色 + 纸页 + 双线框 + 投影）。
        letter: {
          // 米黄底要配深暖褐字，否则一片糊
          bg: "#eadfc8",
          titleColor: "#2c2218",
          authorColor: "#5c4e3d",
          albumTextColor: "#3a2e22",
          albumArtistColor: "#5c4e3d",
          emptyCell: "#cfc0a4",
          // 纸页比底色更亮更冷一点，才有「压在米黄底上的白纸」的层次
          paperFill: "#fbf6ea",
          paperLine: "rgba(92,78,61,0.42)",
        },
      };


      // ===== 标题字号 =====
      // std/big/xl 对应基准字号；head 由 pad + 字号 * 1.8 推导出来，
      // 只影响画布高度与网格起始 y，绝不参与格子尺寸计算。
      const TITLE_SIZES = { std: 80, big: 100, xl: 120 };
      const titleFontSizeOf = (key) => TITLE_SIZES[key] || TITLE_SIZES.std;

      // ===== 标题字体 =====
      // stack 里把中文可用字体排在前面，英文名字（Bebas/Montserrat…）
      // 缺中文字符时会自动回落到后面的系统中文字体，不会出豆腐块。
      const SYS_CN = '"PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC"';
      const fonts = {
        system: { stack: `-apple-system, "Helvetica Neue", ${SYS_CN}, sans-serif`, weight: 800 },
        // Anton 只有一套 400 字重，但它本身极粗极高，正是诗页版式要的调子
        anton: { stack: `"Anton", ${SYS_CN}, sans-serif`, weight: 400 },
        smiley: { stack: `"Smiley Sans", ${SYS_CN}, sans-serif`, weight: 400 },
        alimama: { stack: `"Alimama ShuHeiTi", ${SYS_CN}, sans-serif`, weight: 900 },
        noto: { stack: `"Noto Sans SC", ${SYS_CN}, sans-serif`, weight: 900 },
        bebas: { stack: `"Bebas Neue", ${SYS_CN}, sans-serif`, weight: 400 },
        montserrat: { stack: `"Montserrat", ${SYS_CN}, sans-serif`, weight: 800 },
        darker: { stack: `"Darker Grotesque", ${SYS_CN}, sans-serif`, weight: 800 },
        nunito: { stack: `"Nunito", ${SYS_CN}, sans-serif`, weight: 800 },
        boldonse: { stack: `"Boldonse", ${SYS_CN}, sans-serif`, weight: 400 },
      };

      // 中文字库体积大（得意黑 1.15MB、阿里妈妈 594KB、思源 100+ 分片），
      // 只有用户真的选了才去 fetch；这里用 FontFace API 精确控制加载时机。
      const FONT_URLS = {
        "Smiley Sans":
          "https://cdn.jsdelivr.net/npm/@fontpkg/smiley-sans@2.0.4/SmileySans-Oblique.ttf.woff2",
        "Alimama ShuHeiTi":
          "https://cdn.jsdelivr.net/npm/@fontpkg/alimama-shu-hei-ti@1.0.5/AlimamaShuHeiTi-Bold.woff2",
      };
      const fontJobs = new Map();
      /**
       * 确保字体可用于 canvas 绘制。
       * 注意：document.fonts.check() 对「按 unicode-range 分片」的字体
       * （思源黑体就是 101 个分片）不可靠 —— 分片未下载时它会返回 false，
       * 即使字体声明完全正常。所以统一用 fonts.load(font, sampleText) 主动拉取，
       * 它只下载 sampleText 命中的那几个分片，比整包快得多。
       */
      function ensureFont(key, sampleText) {
        const sample = sampleText || "Top Albums of My Life 中文专辑";
        const weightOf = {
          smiley: 400, alimama: 900, noto: 900,
          bebas: 400, anton: 400, boldonse: 400, montserrat: 800, darker: 800, nunito: 800,
        };
        // 去掉引号的 family 名，fonts.load 和 @font-face 都要能对上
        const famRaw = (fonts[key] && fonts[key].stack || "").split(",")[0].trim().replace(/^["']|["']$/g, "");
        if (!famRaw || famRaw === "-apple-system") return Promise.resolve(); // 系统字体无需等待

        const weight = weightOf[key] || 400;
        const jobKey = famRaw + "|" + weight;
        if (fontJobs.has(jobKey)) return fontJobs.get(jobKey);

        const job = new Promise((resolve) => {
          let settled = false;
          const done = () => { if (!settled) { settled = true; resolve(); } };
          // 关键：必须显式 fonts.load 才会去下载字体文件。
          // 光等 document.fonts.ready 是不够的 —— 它只等「已开始的」加载，
          // 而字体要等第一次真正绘制时才懒加载，于是首帧就用回退字画了。
          document.fonts
            .load(`${weight} 80px "${famRaw}"`, sample)
            .then((faces) => {
              if (faces && faces.length) return done();
              return loadByApi(famRaw, key).then(done);
            })
            .catch(() => loadByApi(famRaw, key).then(done));
          // 兜底超时：网络太差也不卡住出图
          setTimeout(done, 5000);
        });
        fontJobs.set(jobKey, job);
        return job;
      }

      // 兜底：直接用二进制构造 FontFace（仅中文字库有直链可用）
      function loadByApi(fam, key) {
        const url = FONT_URLS[fam];
        if (!url) return Promise.resolve();
        return new FontFace(fam, `url("${url}")`, {
          weight: key === "alimama" ? "900" : "400",
          display: "swap",
        })
          .load()
          .then((f) => document.fonts.add(f))
          .catch(() => {});
      }

      // ===== 背景绘制 =====
      // 现在三个主题都是纯色底，没有一张背景照片。
      // 米色信笺的质感全部由代码画出来：底色 + 两张纸页 + 双线框 + 投影，
      // 所以这里只剩「填一个矩形」—— 也就没有了图片解码、canvas 污染
      // 和首帧闪白这一整类问题。
      function paintBackground(ctx, W, H, themeKey) {
        const t = themes[themeKey] || themes.dark;
        ctx.fillStyle = t.bg;
        ctx.fillRect(0, 0, W, H);
      }

      // ===== 渲染状态 =====
      // hasRendered：画布上是否已有内容（决定改下拉框时是否自动重绘）
      // posterData：上一次绘制用的快照，即选即看时直接复用，不再重新下载封面
      let hasRendered = false;
      let posterData = null; // { pick, imgs, L, miss }
      let redrawTimer = null;

      // ===== 加载遮罩 =====
      let veilShownAt = 0;
      const VEIL_MIN_MS = 520; // 最短显示时长

      function showVeil() {
        const v = $("drawVeil");
        if (!v) return;
        veilShownAt = performance.now();
        v.hidden = false;
        void v.offsetWidth; // 强制回流，否则 transition 不触发
        v.classList.add("on");
      }

      function hideVeil() {
        const v = $("drawVeil");
        if (!v || v.hidden) return;
        // 渲染太快（实测 16 张封面只要 ~100ms）时遮罩会一闪而过，
        // 观感更像"闪屏抖动"而不是"加载"。压到最短 520ms 再淡出，
        // 反而更沉稳；真正的重绘（图像下载）耗时远超这个值，不会造成延迟感。
        const wait = Math.max(0, VEIL_MIN_MS - (performance.now() - veilShownAt));
        setTimeout(() => {
          v.classList.remove("on");
          setTimeout(() => {
            if (!v.classList.contains("on")) v.hidden = true;
          }, 340);
        }, wait);
      }

      /**
       * 单曲版式绘制。两套版式共用同一套排版语言：
       *   - 字体统一 Helvetica/Arial 粗体（干练、无衬线、和数字很搭）
       *   - 数字永远比曲名更醒目（排名是这个海报的主张）
       *   - 曲名超长时截断加省略号，不折行 —— 折行会把行高节奏打乱
       *
       * 与专辑版式的关键差别：不画「专辑名」，画「曲名」；
       * 数字是设计元素而非角标，所以字重要拉到 900 并按主题取反色。
       */
      function drawTrackPoster(x, L, pick, imgs, themeKey, titleTxt, authorTxt) {
        const t = themes[themeKey] || themes.dark;
        const isLight = themeKey === "light";
        const isLetter = themeKey === "letter";

        // 单曲海报的配色不跟随专辑主题的 albumTextColor ——
        // 那套颜色是为「封面下方的小字」调的，用在 100px 的排名数字上
        // 会太弱。这里显式给出三档对比度。
        const cTitle = isLight ? "#111111" : isLetter ? "#2c2218" : "#ffffff";
        const cNum = isLight ? "#111111" : isLetter ? "#2c2218" : "#ffffff";
        const cTrack = isLight ? "#111111" : isLetter ? "#2c2218" : "#ffffff";
        const cArtist = isLight ? "#767676" : isLetter ? "#7a6a52" : "#9a9a9a";
        const cLine = isLight ? "rgba(0,0,0,0.18)" : isLetter ? "rgba(92,78,61,0.26)" : "rgba(255,255,255,0.20)";
        // 封面缺失（空白格）时的数字兜底色：空白格是 #2a2a2d 一类的深灰，
        // 用半透明白字最稳。
        const cNumOver = "rgba(255,255,255,0.50)";
        // 曲名标签条：纯白底 + 纯黑字，三个主题一致。
        // 标签条是「压在封面下沿之上」的，它背后永远是封面而不是画布底色，
        // 所以不需要跟着主题反色。浅色主题曾经做成黑底白字，结果九宫格里
        // 出现九条黑杠，把封面本身的色彩全压下去了 —— 而且规格要的就是
        // "纯白色的长条标签，里面写黑色歌名"。
        const cChipBg = "#ffffff";
        const cChipText = "#111111";

        /**
         * 压在封面上的巨大数字 —— 颜色必须由**封面自身明暗**决定。
         *
         * 原来按主题硬编码（深色主题白字、浅色/米色主题深字），
         * 实测在橙棕色封面上，透明度 0.34 的深色数字几乎与底色融为一体，
         * 整格只剩封面、排名完全丢失。排名是这张海报的主张，不能靠猜。
         *
         * 做法：把封面缩到 16×16 取数字所在的右下区域，算感知亮度，
         * 然后反推所需透明度，保证「数字」与「底色」的亮度差 ≥ 0.35。
         * 画布被污染（理论上不会，封面都走 CORS）时回落到白色 0.5。
         */
        const overlayNumColor = (img) => {
          const S = 16;
          let lum = 0.45;
          try {
            const c = document.createElement("canvas");
            c.width = c.height = S;
            const g = c.getContext("2d", { willReadFrequently: true });
            g.drawImage(img, 0, 0, S, S);
            // 只采数字实际压着的那块：右侧 45%~100%、纵向 30%~85%
            const x0 = Math.round(S * 0.45);
            const y0 = Math.round(S * 0.3);
            const d = g.getImageData(x0, y0, S - x0, Math.round(S * 0.55) + 1 - y0).data;
            let sum = 0;
            let n = 0;
            for (let k = 0; k < d.length; k += 4) {
              // Rec.709 感知亮度；直接算术平均会被高饱和色带偏
              sum += 0.2126 * d[k] + 0.7152 * d[k + 1] + 0.0722 * d[k + 2];
              n++;
            }
            if (n) lum = sum / n / 255;
          } catch (e) {}
          // 底色偏暗 → 亮数字；底色偏亮 → 深数字
          const useLight = lum < 0.5;
          const target = 0.35;
          let a = useLight ? target / (1 - lum) : target / lum;
          a = Math.max(0.3, Math.min(0.72, a));
          return useLight ? `rgba(255,255,255,${a.toFixed(2)})` : `rgba(17,17,17,${a.toFixed(2)})`;
        };

        const bold = (px) => `900 ${px}px ${TRACK_FONT}`;
        const med = (px) => `700 ${px}px ${TRACK_FONT}`;

        x.textAlign = "left";
        x.textBaseline = "alphabetic";

        // ---------- 版式 B：九宫格数字叠加 ----------
        if (L.mode === "track9") {
          // 大标题
          x.fillStyle = cTitle;
          x.font = bold(L.titleSize);
          let big = (titleTxt || "MY FAVORITE TRACKS").toUpperCase();
          // 一行放不下就按字号缩，绝不折行 —— 这个标题是版面的横向基准
          big = fitShrink(x, big, L.W - L.pad * 2, L.titleSize, bold);
          x.fillText(big, L.titleX, L.titleY);

          // 副标题
          x.fillStyle = cArtist;
          x.font = med(L.subSize);
          x.fillText("PLAYLIST", L.subX, L.subY);

          let i = 0;
          for (let r = 0; r < L.rows; r++) {
            const cnt = L.counts[r] || 0;
            // 末行不满时整体右移半个格位，视觉居中。
            // 左对齐会让末行顶着左边、右边空一大块，看起来像没画完。
            const shift = (L.side - cnt) * (L.s + L.gap) * 0.5;
            for (let c = 0; c < cnt; c++) {
              const it = pick[i];
              const img = imgs[i];
              if (!it) break;

              const cw = L.s;
              const cx = L.pad + shift + c * (cw + L.gap);
              const cy = L.head + r * L.rowH;

              // 封面
              if (img) drawCover(x, img, cx, cy, cw);
              else {
                x.fillStyle = t.emptyCell;
                x.fillRect(cx, cy, cw, cw);
              }

              // 巨大数字压右下角，半透明。
              // 位置要点：基线必须落在标签条之上，否则数字下半截
              // 会被标签条盖掉 —— 参考图里数字是完整清晰的。
              // 标签条顶边在 cy + cw - chipH/2 处，所以数字基线取
              // cw * 0.80 留出安全余量。
              // 颜色逐格按封面明暗反推（见 overlayNumColor），
              // 同一张海报里九格数字可能是黑白混的 —— 这是对的，
              // 每格都要保证能看清。
              const nStr = String(i + 1);
              x.font = bold(L.numSize);
              x.fillStyle = img ? overlayNumColor(img) : cNumOver;
              x.textAlign = "right";
              const numRight = cx + cw - Math.round(cw * 0.02);
              const numBase = cy + Math.round(cw * 0.80);
              x.fillText(nStr, numRight, numBase);
              x.textAlign = "left";

              // 白色标签条：压在封面下沿之上（不是贴着下面），
              // 这样它读起来是"盖在照片上的标签"而不是"照片的说明区"
              const chipH = L.labelH;
              const chipY = cy + cw - Math.round(chipH * 0.5);
              x.fillStyle = cChipBg;
              x.fillRect(cx, chipY, cw, chipH);
              // 白标签在浅色主题（画布 #f5f5f5）上会与底色糊成一片，
              // 只剩黑色曲名悬在空中。给一道比画布略深的极细描边，
              // 让它始终是个"贴纸"而不是"消失的底"。
              x.strokeStyle = isLight ? "rgba(0,0,0,0.16)" : "rgba(0,0,0,0.20)";
              x.lineWidth = 2;
              x.strokeRect(cx + 1, chipY + 1, cw - 2, chipH - 2);

              // 曲名：缩字号而不是截断。
              // 截断会把 "APOCALYPSE DREAMS" 切成 "APOCALYPSE …"，
              // 而曲名恰恰是这张海报唯一的信息载体，不能省。
              x.fillStyle = cChipText;
              const labelMaxW = cw - Math.round(cw * 0.08);
              const labelSize = shrinkToWidth(
                x,
                it.name.toUpperCase(),
                labelMaxW,
                Math.round(chipH * 0.62),
                bold,
                11
              );
              x.textAlign = "center";
              x.fillText(it.name.toUpperCase(), cx + cw / 2, chipY + Math.round(chipH * 0.70));
              x.textAlign = "left";

              // 歌手名在标签条下方，同样缩字号
              x.fillStyle = cArtist;
              const aSize = shrinkToWidth(
                x,
                (it.artist || "").toUpperCase(),
                labelMaxW,
                Math.round(L.artistH * 0.78),
                med,
                10
              );
              x.textAlign = "center";
              x.fillText((it.artist || "").toUpperCase(), cx + cw / 2, chipY + chipH + Math.round(L.artistH * 0.85));
              x.textAlign = "left";

              i++;
            }
          }
          return;
        }

        // ---------- 版式 A：列表串烧 ----------
        // 大标题
        x.fillStyle = cTitle;
        x.font = bold(L.bigTitleSize);
        let bt = (titleTxt || "MY FAVORITE TRACKS").toUpperCase();
        bt = fitShrink(x, bt, L.bigTitleW, L.bigTitleSize, bold);
        x.fillText(bt, L.bigTitleX, L.bigTitleY);

        for (let i = 0; i < L.N; i++) {
          const it = pick[i];
          if (!it) break;
          const img = imgs[i];

          const rowTop = L.head + i * L.rowPitch;
          const rowMid = rowTop + L.rowPitch / 2;

          // 排名数字：右对齐到统一基线，垂直居中于行。
          // 必须右对齐而不是左对齐 —— 否则 1~9 贴着左边、10 以后
          // 突然变宽，数字与缩略图之间的缝一会儿宽一会儿窄，
          // 整列看起来是歪的。右对齐后所有编号的右边缘齐平。
          // 垂直：数字的 cap 高约字号的 0.72，要让**视觉**居中，
          // 基线得落在 rowMid + capH/2 而不是 rowMid + size*0.36。
          x.fillStyle = cNum;
          x.font = bold(L.numSize);
          x.textAlign = "right";
          x.fillText(String(i + 1), L.numX + L.numW, rowMid + Math.round(L.numSize * 0.72 / 2));
          x.textAlign = "left";

          // 缩略封面：垂直居中于行
          const thY = rowMid - L.thumb / 2;
          if (img) drawCover(x, img, L.thumbX, thY, L.thumb);
          else {
            x.fillStyle = t.emptyCell;
            x.fillRect(L.thumbX, thY, L.thumb, L.thumb);
          }

          // 曲名：大字白色粗体。超长时缩字号而不是截断 ——
          // 列表版每行有整幅宽度可用，缩一点字号几乎看不出来，
          // 但截断会让曲名失去辨识度。
          //
          // 垂直对齐全换成了「文字块整体居中」：
          // 原来是曲名基线取 rowMid + titleSize*0.06，歌手名再往下推
          // 1.32 倍字号 —— 那套偏移是给 75px 小字调的，字号翻到 126 之后
          // 两行会整体偏下、压到分隔线上。
          // 现在先算两行合起来的高度，再把块顶对齐到行内的垂直中心。
          x.fillStyle = cTrack;
          const nameMaxW = L.textRight - L.textX;
          const nameTxt = it.name.toUpperCase();
          const nameSize = x.measureText(nameTxt).width > nameMaxW
            ? shrinkToWidth(x, nameTxt, nameMaxW, L.titleSize, bold, 40)
            : (x.font = bold(L.titleSize), L.titleSize);
          // 两行文本块的视觉高度：曲名 cap 高 + 间距 + 歌手名 cap 高
          const titleCap = Math.round(nameSize * 0.72);
          const artistCap = Math.round(L.artistSize * 0.72);
          const blockH = titleCap + L.artistGap + artistCap;
          const blockTop = rowMid - blockH / 2;
          const nameBase = blockTop + titleCap;
          const artistBase = nameBase + L.artistGap;
          x.fillText(nameTxt, L.textX, nameBase);

          // 歌手名：小字灰色
          x.fillStyle = cArtist;
          const artistTxt = (it.artist || "");
          if (x.measureText(artistTxt).width > nameMaxW) {
            shrinkToWidth(x, artistTxt, nameMaxW, L.artistSize, med, 30);
          } else {
            x.font = med(L.artistSize);
          }
          x.fillText(artistTxt, L.textX, artistBase);

          // 分隔线：贯穿整行底部，极淡
          x.strokeStyle = cLine;
          x.lineWidth = 2;
          x.beginPath();
          const lineY = rowTop + L.rowPitch - 6;
          x.moveTo(L.lineX0, lineY);
          x.lineTo(L.lineX1, lineY);
          x.stroke();
        }

        // 落款：列表版右下角，谦逊地待着，不抢戏
        if (authorTxt) {
          x.fillStyle = cArtist;
          x.font = med(34);
          x.textAlign = "right";
          x.fillText("by " + authorTxt, L.W - L.pad, L.H - Math.round(L.pad * 0.45));
          x.textAlign = "left";
        }
      }

      /**
       * 缩字号直到塞进 maxW，返回**最终字号**（不是文本）。
       * 用于九宫格里的曲名/歌手名：这些文字必须完整显示，
       * 截断会把 "APOCALYPSE DREAMS" 变成 "APOCALYPSE …"，
       * 而曲名是这张海报唯一的信息载体。
       */
      function shrinkToWidth(x, text, maxW, startPx, fontFn, minPx) {
        let px = startPx;
        const floor = minPx || 10;
        x.font = fontFn(px);
        while (px > floor && x.measureText(text).width > maxW) {
          px -= 2;
          x.font = fontFn(px);
        }
        return px;
      }

      /**
       * 单行放不下时按字号递减，直到塞进 maxW。
       * 用于大标题 —— 折行会破坏横向基准线，缩字号是更安全的选择。
       */
      function fitShrink(x, text, maxW, startPx, fontFn) {
        let px = startPx;
        while (px > 20 && x.measureText(text).width > maxW) {
          px -= 4;
          x.font = fontFn(px);
        }
        return text;
      }

      /**
       * 绘制海报
       * @param {boolean} isFirstTime
       *   true  = 首次生成 / 专辑变动后重新生成 → 显示遮罩、加载封面
       *   false = 改主题/字体/布局触发的「即选即看」→ 无遮罩、纯内存重绘
       */
      async function renderPoster(isFirstTime) {
        const pick = filled();
        if (!pick.length) {
          $("warn").textContent = "先添加几张专辑。";
          hideVeil();
          return;
        }

        const themeKey = $("themeSel").value;
        const fontKey = $("fontSel").value;
        const theme = themes[themeKey] || themes.dark;

        if (isFirstTime) {
          showVeil();
          $("warn").textContent = "正在计算完美排版...";
        }

        try {
          // 字体：中文字库按需拉取；document.fonts.ready 确保 canvas 拿到真字体
          // （否则第一次绘制会用回落的系统字体，字重差异很明显）
          // 传入标题/作者文字，让分片字体只下载真正要画的那些字
          const titleTxt = $("title").value.trim() || "Top Albums of My Life";
          const authorTxt = $("author").value.trim();
          await ensureFont(fontKey, titleTxt + " by " + authorTxt + " 0123456789");
          try {
            await document.fonts.ready;
          } catch (e) {}

          const showInfo = $("showInfo").value === "1";
          const layoutPref = $("layoutSel").value;
          const total = pick.length;
          const titleSizeKey = $("titleSizeSel").value;
          const titleFontSize = titleFontSizeOf(titleSizeKey);
          // 单曲模式走独立版式，绝不进 buildLayout —— 那个函数里
          // 三个分支的公式都被逐像素断言锁着，不能碰。
          const L = isTrackMode
            ? buildTrackLayout(total, null, { titleSize: titleSizeKey })
            : buildLayout(total, showInfo, layoutPref, titleSizeKey, titleTxt, fontKey);

          // 图片：首次走网络 + 写入 imageCache；即选即看时全部命中缓存
          let imgs;
          if (isFirstTime || !posterData) {
            imgs = [];
            for (let i = 0; i < pick.length; i++) {
              $("warn").textContent = `正在加载封面：${i + 1} / ${pick.length}`;
              imgs.push(await load(pick[i].src));
            }
          } else {
            imgs = await Promise.all(pick.map((it) => load(it.src)));
          }

          const W = L.W;
          const padY = L.padY || L.pad;
          const gap = L.gap;
          const baseFont = L.baseFont;
          const cap = L.textMode ? baseFont * 2.6 : 0;
          const fontDef = fonts[fontKey] || fonts.system;

          const cv = $("cv");
          cv.width = W;
          cv.height = L.H;
          const x = cv.getContext("2d");

          // 背景（各主题都是纯色底）
          paintBackground(x, W, L.H, themeKey);

          // ===== 单曲版式：提前返回 =====
          // 两套单曲版式与专辑版式的绘制逻辑没有一行可复用
          // （专辑是"封面 + 可选小字"，单曲是"大数字 + 曲名 + 分隔线"），
          // 所以单独成函数并在这里分流，画完就结束，不往下走专辑的绘制路径。
          if (L.mode === "track9" || L.mode === "tracklist") {
            drawTrackPoster(x, L, pick, imgs, themeKey, titleTxt, authorTxt);
            posterData = { pick, imgs, L, miss: 0 };
            hasRendered = true;
            cv.style.display = "block";
            $("dl").style.display = "";
            syncSaveImg(cv);

            const tName = L.mode === "track9" ? "九宫格单曲" : "列表单曲";
            if (!isFirstTime) {
              $("warn").textContent = `${tName} · ${themeKey === "light" ? "极简白" : themeKey === "letter" ? "米色信笺" : "深邃黑"} · 已实时更新`;
            } else {
              $("warn").textContent = IS_TOUCH
                ? `生成完成（${tName}）！长按上方图片即可存入相册。`
                : `生成完成（${tName}）！点击下载图片。`;
            }
            return;
          }

          // ===== 诗页堆叠：两页细线纸框 =====
          // 先画后页（偏左上），再画前页（偏右下）盖住它，
          // 露出两条边 —— 这就是"两张诗页叠着"的全部识别点。
          if (L.mode === "poem" && L.poem) {
            const P = L.poem;
            const t = themes[themeKey] || themes.dark;
            const fillCol = t.paperFill || "rgba(255,255,255,0.30)";
            const lineCol = t.paperLine || "rgba(92,78,61,0.36)";
            const lw = Math.max(1.6, Math.round(W / 1100));

            const page = (px, py, fillA, lineA) => {
              // 纸页落影：浅色底上"白纸压白纸"本来没有边界，
              // 必须先有一层投影把纸从背景里抬起来，双层才有层次。
              x.save();
              x.shadowColor = "rgba(40,26,10,0.20)";
              x.shadowBlur = Math.round(P.outerPad * 0.55);
              x.shadowOffsetY = Math.round(P.outerPad * 0.14);
              x.fillStyle = fillCol;
              x.globalAlpha = fillA;
              x.fillRect(px, py, P.pw, P.ph);
              x.restore();

              x.save();
              x.strokeStyle = lineCol;
              x.globalAlpha = lineA;
              x.lineWidth = lw;
              x.strokeRect(px, py, P.pw, P.ph);

              // 内缩的第二道细线：TTPD 的识别点就是「双线」，
              // 单线会像相框，双线才像印在纸上的版心框。
              x.globalAlpha = lineA * 0.62;
              x.lineWidth = lw;
              const d = Math.round(P.pw * 0.011);
              x.strokeRect(px + d, py + d, P.pw - d * 2, P.ph - d * 2);
              x.restore();
            };

            page(P.backX, P.backY, 0.55, 0.62);   // 后页
            page(P.frontX, P.frontY, 1, 1);       // 前页
          }

          // 标题与作者：位置由布局给出，保证方形画幅下也不贴边
          const titleY = L.titleY || padY + 60;
          const subY = L.subY || padY + 120;
          const leftX = L.contentLeft !== undefined ? L.contentLeft : L.padY;

          x.textBaseline = "alphabetic";
          x.fillStyle = theme.titleColor;
          const isLatinCaps = isCapsFont(fontKey);
          // 字号来自「标题大小」下拉框；仍用各字体自带的字重，
          // 硬写 bold 会把思源/阿里妈妈这类本身已很粗的字重再叠一次导致糊边。
          // 诗页版式不用全局字号，改用自己那套 186/210/234 的档位。
          const drawTitleSize =
            L.mode === "poem" && L.drawTitleSize
              ? L.drawTitleSize
              : titleFontSize;
          x.font = `${fontDef.weight} ${drawTitleSize}px ${fontDef.stack}`;
          let titleRender = isLatinCaps ? titleTxt.toUpperCase() : titleTxt;
          let titleLines = [titleRender];
          if (L.mode === "poem" && L.poem) {
            const maxW = L.poem.pw - L.poem.paperPad * 2;
            // 策略：先按词（中文按字）折行，最多两行；
            // 两行还装不下才缩小字号。
            // 只缩不折会把 186px 压到 70px，标题彻底失去"压场感"，
            // 而纸内还留着一大块本该给字的空白 —— 两头都不好看。
            titleLines = wrapTitle(x, titleRender, maxW, 2);
            // 两行仍超宽：退回一行并用字号兜底
            if (titleLines.some((ln) => x.measureText(ln).width > maxW)) {
              titleLines = [titleRender];
              let size = drawTitleSize;
              while (size > 24 && x.measureText(titleRender).width > maxW) {
                size -= 2;
                x.font = `${fontDef.weight} ${size}px ${fontDef.stack}`;
              }
            }
          }
          // 多行时每行按字号行高递进；单行时就是原基线
          const lineH = Math.round(drawTitleSize * 1.06);
          titleLines.forEach((ln, i) => {
            x.fillText(ln, leftX, titleY + i * lineH);
          });

          const authorText = authorTxt;
          if (authorText) {
            x.fillStyle = theme.authorColor;
            if (L.mode === "poem" && L.poem) {
              // 诗页版式：作者像"落款"一样居中放在纸张底边之下，
              // 和左上角的大标题形成对角呼应
              const P = L.poem;
              x.font = `400 ${P.sigSize}px -apple-system, "Helvetica Neue", ${SYS_CN}, sans-serif`;
              x.textAlign = "center";
              x.fillText("by " + authorText, P.frontX + P.pw / 2, P.sigY);
              x.textAlign = "left"; // 复位，后续专辑文字仍按左对齐绘制
            } else {
              x.font = `400 36px -apple-system, "Helvetica Neue", ${SYS_CN}, sans-serif`;
              x.fillText("by " + authorText, leftX, subY);
            }
          }

          if (isFirstTime) $("warn").textContent = "正在绘制最终海报...";

          let miss = 0;
          let y = L.head;
          let itemIndex = 0;

          for (let r = 0; r < L.counts.length; r++) {
            const cCount = L.counts[r];
            // 诗页版式的格子边长与方格分支同一套公式（L.s），所以同样用 L.s
            const s = L.mode === "stair" ? L.sizes[r] : L.s;
            // 每行水平居中，保证左右留白对称。
            // 诗页版式要相对「前页纸」居中，而不是相对画布 —— 否则
            // 因为两页有错位，网格会整体偏移，纸边左右不等宽。
            const rowW = cCount * s + (cCount - 1) * gap;
            const x0 = L.mode === "poem" ? L.poem.frontX + L.poem.paperPad : (W - rowW) / 2;

            for (let c = 0; c < cCount; c++) {
              const cx = x0 + c * (s + gap);
              const cy = y;
              const it = pick[itemIndex];
              const img = imgs[itemIndex];

              if (img) {
                drawCover(x, img, cx, cy, s);
              } else {
                miss++;
                x.fillStyle = theme.emptyCell;
                x.fillRect(cx, cy, s, s);
              }

              if (L.textMode) {
                x.fillStyle = theme.albumTextColor;
                x.font = `500 ${baseFont}px ${SYS_CN}, sans-serif`;
                x.fillText(fit(x, it.name, s), cx, cy + s + baseFont * 1.5);

                x.fillStyle = theme.albumArtistColor;
                x.font = `400 ${baseFont * 0.82}px ${SYS_CN}, sans-serif`;
                x.fillText(fit(x, it.artist, s), cx, cy + s + baseFont * 2.5);
              }
              itemIndex++;
            }
            y += s + cap + gap;
          }

          posterData = { pick, imgs, L, miss };
          hasRendered = true;

          cv.style.display = "block";
          $("dl").style.display = "";
          // iOS Safari 忽略 <a download>，canvas 元素本身也不支持长按保存。
          // 生成后把画布内容镜像成一张真实 <img>：触摸设备上显示它（可长按存入相册），
          // 桌面端保持 canvas + 下载按钮不变。
          syncSaveImg(cv);

          const modeTip =
            L.mode === "square"
              ? `方形网格 ${L.side}×${L.side}`
              : L.mode === "poem"
              ? `诗页堆叠 ${L.side}×${L.side}`
              : "阶梯排版";
          const themeName =
            themeKey === "light" ? "极简白" : themeKey === "letter" ? "米色信笺" : "深邃黑";
          const sizeName =
            titleSizeKey === "big" ? "偏大" : titleSizeKey === "xl" ? "超大" : "标准";
          if (miss) {
            $("warn").textContent = `完成（${modeTip} · ${themeName}）！但 ${miss} 张封面加载失败（显示为灰块）。`;
          } else if (!isFirstTime) {
            $("warn").textContent = `${modeTip} · ${themeName} · 标题${sizeName} · 已实时更新`;
          } else {
            $("warn").textContent = IS_TOUCH
              ? `生成完成（${modeTip}）！长按上方图片即可存入相册。`
              : `生成完成（${modeTip}）！点击下载图片。`;
          }
        } finally {
          hideVeil();
        }
      }

      // ===== 首次生成 =====
      $("gen").onclick = () => renderPoster(true);

      // ===== 即选即看：改下拉框直接重绘（300ms 防抖，无遮罩） =====
      function scheduleRedraw() {
        // 画布还没内容时什么都不做，等用户点「生成图片」
        if (!hasRendered) return;
        clearTimeout(redrawTimer);
        redrawTimer = setTimeout(() => renderPoster(false), 300);
      }
      ["themeSel", "fontSel", "titleSizeSel", "showInfo", "layoutSel"].forEach((id) => {
        const el = $(id);
        if (el) el.addEventListener("change", scheduleRedraw);
      });

      // 触摸设备（手机/平板）才走长按保存路径
      const IS_TOUCH =
        window.matchMedia("(hover: none) and (pointer: coarse)").matches ||
        navigator.maxTouchPoints > 1;

      function syncSaveImg(canvas) {
        const img = $("saveImg");
        const tip = $("saveTip");
        if (!IS_TOUCH || !img || !canvas.width) return;

        // 用 JPEG（0.92）：2400px 海报存成 PNG 有 4-8MB，手机上保存慢、
        // 部分机型直接失败；封面本就是照片，JPEG 观感几乎无差别（约 200KB）。
        // 用 data: URL 而不是 blob: —— iOS Safari 对 blob 图片长按保存
        // 时常给出空白结果，data URL 才是稳的那条路。
        try {
          const url = canvas.toDataURL("image/jpeg", 0.92);
          if (!url || url.length < 1024) return;
          img.src = url;
          img.style.display = "block";
          canvas.style.display = "none";
          if (tip) tip.style.display = "block";
        } catch (e) {
          // 画布被跨域图片污染时会抛错，此时保持 canvas 原样显示
        }
      }

      function clearSaveImg() {
        const img = $("saveImg");
        const tip = $("saveTip");
        if (img) {
          img.removeAttribute("src");
          img.style.display = "none";
        }
        if (tip) tip.style.display = "none";
      }

      $("dl").onclick = () => $("cv").toBlob((b) => {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(b);
          a.download = "my-top-albums.png";
          a.click();
        });

      // ===== 导出歌单 =====
      // 三种输出，都对应当下 filled() 的顺序（即海报上的名次）：
      //   1. .m3u8 —— 通用歌单文件，Apple Music / VLC / MusicFree 都能读
      //   2. .txt  —— 纯文本「曲名 - 歌手」，配 Apple 快捷指令一键建歌单
      //   3. 复制到剪贴板 —— 直接贴进各种「导入歌单」输入框
      //
      // 为什么是 .m3u8 而不是 .m3u：
      //   .m3u 按 ANSI 编码，中文曲名到了别的机器上会变乱码；
      //   .m3u8 就是同一个格式的 UTF-8 版，扩展名里的 8 指的就是 UTF-8。
      //   我们的曲名大量是中日韩文字，必须用 .m3u8。
      //
      // 关于「导进网易云」的实情（写下来免得以后又忘）：
      //   网易云的「导入本地歌单」只解析 m3u 里的**本地音频路径**，
      //   不会拿 EXTINF 里的曲名去曲库匹配。所以纯 URL 的 m3u 导入进去
      //   大概率是空歌单。能真正导入的路径是它 App 里的
      //   「一键导入外部音乐 → 截图 OCR」—— 我们本来就是画图工具，
      //   海报本身就是最好的输入。这里的 m3u/txt 主要服务
      //   Apple Music、MusicFree、以及需要清单的场合。
      function playlistRows() {
        return filled().map((it) => ({
          name: String(it.name || "").trim(),
          artist: String(it.artist || "").trim(),
          album: String(it.album || "").trim(),
          dur: Number(it.dur) || 0,
          amUrl: String(it.amUrl || "").trim(),
          // kind 用来区分「专辑」和「单曲」——
          // 专辑没有单曲直链是正常的，不能当成缺失去警告
          kind: it.kind || "album",
        }));
      }

      function buildM3U8(rows, title) {
        const L = ["#EXTM3U", "#PLAYLIST:" + (title || "Lifeline")];
        rows.forEach((r) => {
          // EXTINF 的标题用「歌手 - 曲名」，这是全行业约定俗成的写法，
          // 各播放器拆解这一行时都按第一个「 - 」切分。
          // 曲名里本身含 " - " 也没关系：播放器只关心第一段是歌手。
          const label = r.artist ? r.artist + " - " + r.name : r.name;
          L.push("#EXTINF:" + (r.dur > 0 ? r.dur : -1) + "," + label);
          // 有 Apple Music 直链就写直链 —— 播放器能直接串流；
          // 没有的话退化成「# 注释 + 曲名」，不会产生一条坏路径。
          // 绝对不能凭空编一个 file:/// 路径：那会让整个歌单在
          // 播放器里刷出一堆"文件不存在"的报错。
          L.push(r.amUrl || "# " + label);
        });
        return L.join("\r\n") + "\r\n";
      }

      function buildTxt(rows) {
        // 一行一首，**艺人在前**：`Artist - Title`。
        //
        // 这个顺序不是随便定的。Soundiiz 的纯文本导入文档原话是
        // "Use Artist - Title, with a space on each side of the hyphen"，
        // 它拿连字符左边当艺人、右边当曲名去曲库匹配。写成
        // `曲名 - 歌手` 的话，它会把曲名当成艺人去搜，命中率极低，
        // 而且匹配错的版本还特别安静（不报错，只是给你一张错歌单）。
        // TuneMyMusic 的「任意文本」入口同理。
        return rows.map((r) => (r.artist ? r.artist + " - " + r.name : r.name)).join("\n") + "\n";
      }

      function downloadText(text, filename, mime) {
        // 必须显式写 UTF-8 BOM 之外还要指定 charset，
        // 否则 Windows 记事本打开中文会乱码
        const blob = new Blob([text], { type: (mime || "text/plain") + ";charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      }

      function safeName(s) {
        return String(s || "playlist")
          .replace(/[\\/:*?"<>|\r\n\t]/g, "")
          .trim()
          .slice(0, 60) || "playlist";
      }

      function trackCount() {
        return filled().filter((x) => x.kind === "track").length;
      }

      $("exp").onclick = () => {
        const rows = playlistRows();
        if (!rows.length) {
          toast("列表是空的", "!");
          return;
        }
        const title = $("title").value.trim() || "My Favorite Tracks";
        const base = safeName(title);
        const nTrack = trackCount();
        const noLink = rows.filter((r) => !r.amUrl).length;

        $("expSub").textContent = "共 " + rows.length + " 首，按海报上的名次排列。";

        // 提示区：只显示「当前必须提醒的」那几条，按严重程度堆叠。
        // 别把某个格式的缺点无条件写在这里 —— 用户如果选的是「复制」，
        // 那句「.m3u8 网易云不认」就是无关信息，只会添乱。
        const tips = [];
        if (noLink) {
          // 区分两种成因，否则「专辑没有直链」会被说成「手动添加的图片」，
          // 用户看着莫名其妙 —— 那张专辑明明是从搜索里来的
          const nAlbumNoLink = rows.filter((r) => !r.amUrl && r.kind !== "track").length;
          const nManual = noLink - nAlbumNoLink;
          const why = [];
          if (nManual > 0) why.push(nManual + " 首是手动添加的（没有来源）");
          if (nAlbumNoLink > 0) why.push(nAlbumNoLink + " 张是专辑（专辑不导出单曲链接）");
          tips.push(noLink + " 条没有 Apple Music 直链：" + (why.join("、") || "来源缺失") +
            "，.m3u8 里会写成注释行，不影响其余曲目。");
        }
        if (nTrack > 0 && nTrack < rows.length) {
          tips.push(
            "列表里有 " + (rows.length - nTrack) + " 张是专辑，歌单里只会取专辑名，" +
              "建议切到单曲模式重新收集。"
          );
        }
        const tipHtml = tips.join("　");
        $("expTip").textContent = tipHtml;

        const dlg = $("expDlg");
        const pick = $("expPick");
        const stepsBox = $("expSteps");
        const closeBtn = $("expClose");

        // 回到选项态：点「换一种格式」和不关重开都会走这里
        const showPick = () => {
          pick.hidden = false;
          stepsBox.hidden = true;
          stepsBox.innerHTML = "";
          $("expTitle").textContent = "导出歌单";
          $("expTip").textContent = tipHtml;
          closeBtn.textContent = "取消";
          // data-view 只用来给 CSS 收掉步骤页里的副标题，
          // 不在 JS 里反复改 style，避免和 media query 打架
          dlg.querySelector(".expbox").dataset.view = "pick";
        };

        dlg.hidden = false;
        showPick();

        const close = () => {
          dlg.hidden = true;
          dlg.onclick = null;
          showPick();
        };
        closeBtn.onclick = close;
        // 点遮罩关闭（点内容区不关）
        dlg.onclick = (e) => {
          if (e.target === dlg) close();
        };

        // 选项点击：执行导出，然后**不关闭**，原地换成「接下来怎么用」。
        // 用户点完按钮的那一刻正是他最想问"然后呢"的时候，
        // 这时候把对话框关掉，等于把答案藏起来了。
        dlg.querySelectorAll(".expopt").forEach((btn) => {
          btn.onclick = () => {
            const k = btn.dataset.k;
            if (k === "m3u") {
              downloadText(buildM3U8(rows, title), base + ".m3u8", "audio/x-mpegurl");
              toast("已下载 " + base + ".m3u8", "↓");
              $("msg").textContent = "已导出 " + rows.length + " 首歌单文件。";
              showSteps("m3u", "已下载 " + base + ".m3u8", rows.length);
            } else if (k === "txt") {
              downloadText(buildTxt(rows), base + ".txt", "text/plain");
              toast("已下载 " + base + ".txt", "↓");
              $("msg").textContent = "已导出纯文本清单，见下方导入步骤。";
              showSteps("txt", "已下载 " + base + ".txt", rows.length);
            } else {
              copyText(
                buildTxt(rows),
                () => {
                  toast("已复制 " + rows.length + " 首到剪贴板", "✓");
                  $("msg").textContent = "清单已复制，见下方导入步骤。";
                  showSteps("copy", "已复制 " + rows.length + " 首到剪贴板", rows.length);
                },
                base,
                // 剪贴板被拒 → 已自动存成 .txt，步骤得切到文件版，
                // 否则还写着"按 ⌘V 粘贴"，而用户手上只有一个文件
                () => showSteps("txt", "复制被浏览器拒绝，已改为下载 .txt", rows.length)
              );
            }
          };
        });

        // 各格式的「往下怎么用」。步骤都按真实界面用词写，
        // 不写"导入歌单"这种笼统说法 —— 用户照着点要能点到。
        function showSteps(k, okText, n) {
          const ICON_OK =
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" ' +
            'stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

          // 两种格式最终都要经过 Soundiiz，步骤主干一致，
          // 只有「第一步从哪拿内容」不同。
          const isCopy = k === "copy";
          const isM3U = k === "m3u";

          const wayIn = isCopy
            ? '<li data-n="2">在 <b>From Plain Text</b>（纯文本）框里按 <kbd>⌘V</kbd> 粘贴。' +
              '它认 <code>艺人 - 曲名</code> 这个格式，正好是刚才复制的样子。</li>'
            : isM3U
              ? '<li data-n="2">回到 Soundiiz，<b>Import Playlist → From File</b>，' +
                '选下载好的 <code>.m3u8</code> 文件。它接受 M3U / M3U8。</li>'
              : '<li data-n="2">回到 Soundiiz，<b>Import Playlist → From File</b>，' +
                '选下载好的 <code>.txt</code> 文件。</li>';

          const html =
            '<div class="stepbox">' +
            '<div class="ok">' + ICON_OK + "<span>" + okText + "</span></div>" +

            "<h4>变成网易云歌单</h4>" +
            '<ol class="steps">' +
            '<li data-n="1">打开 <b>soundiiz.com</b>，用邮箱注册（免费版够用）。</li>' +
            wayIn +
            '<li data-n="3">连接 <b>网易云音乐</b>：平台列表里选它 → <b>Connect</b> → ' +
            "会出现一张二维码，用网易云 App 右上角的扫码确认（不用输密码）。</li>" +
            '<li data-n="4">选 <b>Transfer</b>，源选刚导入的清单，目标选网易云 → ' +
            "<b>Confirm</b>。匹配完歌单就直接出现在你网易云的「我的歌单」里。</li>" +
            "</ol>" +
            '<p class="note">免费版：每次最多 200 首，歌单数量不限、不过期。' +
            (n > 200 ? "你这次有 " + n + " 首，超过的部分要分批。" : "你这次 " + n + " 首，一次就够。") +
            "</p>" +
            (isM3U
              ? '<p class="note">Soundiiz 里第 4 步的「目标」可以换成 Apple Music、Spotify 等任一平台。' +
                "但别双击这个文件指望 Apple 的「音乐」App 打开它 —— 它只认本地音频文件，导入网页链接会得到一张空歌单。</p>"
              : "") +

            '<p class="alt"><b>不想用第三方工具？</b>网易云 App 里也能直接吃这张海报：' +
            "「我的」→ 心动模式上方三点 → <b>一键导入外部音乐</b> → 底部<b>截图导入</b> → " +
            "选你刚生成的那张图。它按 OCR 认曲名，所以海报上的字越大越准 —— " +
            "一次最多 9 张截图，但海报一张就够。</p>" +

            '<button class="back" id="expBack" type="button">换一种格式</button>' +
            "</div>";

          pick.hidden = true;
          stepsBox.hidden = false;
          stepsBox.innerHTML = html;
          $("expTitle").textContent = "接下来怎么用";
          $("expTip").textContent = ""; // 步骤里已经说清楚了，别再顶一条黄条
          closeBtn.textContent = "完成";
          dlg.querySelector(".expbox").dataset.view = "steps";
          $("expBack").onclick = showPick;
        }
      };

      // 复制到剪贴板：clipboard API 在 file:// 下常被拒，
      // 必须留 execCommand 的退路，否则本地打开时就废了。
      // 两条路都失败时**自动降级成下载 .txt** —— 只弹一句"复制失败"
      // 等于把用户卡死在这儿，他连内容都拿不到。
      // onFallback：降级后要换成「文件版」的步骤，不能还挂着"已复制"。
      function copyText(text, done, fallbackName, onFallback) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done).catch(() => legacy());
        } else {
          legacy();
        }
        function legacy() {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.top = "-9999px";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          let ok = false;
          try {
            ok = document.execCommand("copy");
          } catch (e) {}
          ta.remove();
          if (ok) {
            done();
          } else {
            // 浏览器不给权限，就退成文件下载
            downloadText(text, (fallbackName || "playlist") + ".txt", "text/plain");
            toast("浏览器不允许复制，已改为下载 .txt", "↓");
            $("msg").textContent = "已下载纯文本清单（浏览器拒绝了剪贴板权限）。";
            if (onFallback) onFallback();
          }
        }
      }

      // 导出按钮的显隐跟着「有没有填过的格子」走，
      // 和「下载图片」一样：没内容时不该出现
      function syncExportBtn() {
        const n = filled().length;
        $("exp").style.display = n ? "" : "none";
      }

      $("clr").onclick = () => {
        if (confirm("清空列表？")) {
          items = [];
          save();
          render();
          $("cv").style.display = "none";
          $("dl").style.display = "none";
          $("warn").textContent = "";
          clearSaveImg();
        }
      };
    </script>

    <!-- 背景墙动效开关：系统禁用了动效时给出提示并提供一键开启 -->
    <script>
      (function motionSwitch() {
        var KEY = "wallMotionOn";
        var html = document.documentElement;
        var tip = document.getElementById("motionTip");
        if (!tip) return;

        var mq = window.matchMedia("(prefers-reduced-motion: reduce)");

        // 用户此前主动开启过，就保持
        if (localStorage.getItem(KEY) === "1") html.setAttribute("data-motion", "on");

        // 不看媒体查询的「声明」，而是实测动画是否真的在推进 ——
        // 有些环境（节能模式 / 远程桌面 / 无 GPU 合成层）会让动画
        // 声明为 running 却不真正前进，只有采样位置才能发现。
        function sync() {
          var forced = html.getAttribute("data-motion") === "on";
          if (forced) { tip.hidden = true; return; }

          var el = document.querySelector(".wt");
          if (!el) { tip.hidden = true; return; }

          var cs = getComputedStyle(el);
          // 声明层面就被关掉了，不用再采样
          if (cs.animationName === "none" || cs.animationPlayState === "paused") {
            showTip();
            return;
          }

          // 声明是运行中，采样一次确认真的在动
          var a = el.getBoundingClientRect().left;
          setTimeout(function () {
            var b = el.getBoundingClientRect().left;
            // 90s 走完 50% 宽度，400ms 约移动 7-8px；留 0.4px 容差
            if (Math.abs(a - b) > 0.4) discardTip();
            else showTip();
          }, 400);
        }

        // 提示条只在页面顶部露出，滚下去就收起 —— 避免挡住网格与按钮
        function placeTip() {
          if (tip.hidden) return;
          tip.classList.toggle("dim", window.scrollY > 160);
        }
        function showTip() {
          tip.hidden = false;
          placeTip();
        }
        function discardTip() {
          tip.hidden = true;
        }
        window.addEventListener("scroll", placeTip, { passive: true });

        tip.addEventListener("click", function () {
          html.setAttribute("data-motion", "on");
          localStorage.setItem(KEY, "1");
          document.querySelectorAll(".wt").forEach(function (el) {
            el.style.animationPlayState = "running";
          });
          sync();
        });

        if (mq.addEventListener) mq.addEventListener("change", sync);
        else if (mq.addListener) mq.addListener(sync);

        // 等封面渲染完再判断一次，避免在骨架阶段误判
        window.addEventListener("load", function () {
          sync();
          setTimeout(sync, 600);
        });
        sync();
      })();
    </script>
  </body>
</html>
